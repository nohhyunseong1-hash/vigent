<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>VIGENT HUB — 스마트 카메라 관제</title>
<style>
:root{ --bg:#05070a; --fg:#cfe9ff; --dim:#5b7891; --ok:#39d98a; --warn:#ffb020; --danger:#ff3b3b; --accent:#39d0ff; --card:#0a1119; --line:rgba(80,130,170,.28); }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"SF Mono","Menlo",monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:22px;padding:10px 16px;border-bottom:1px solid var(--line);background:#070c12}
.brand{font-weight:800;color:var(--accent);letter-spacing:.14em;font-size:16px}
.brand small{color:var(--dim);font-weight:400;letter-spacing:.2em;font-size:10px;display:block}
.kpis{display:flex;gap:12px;flex:1;flex-wrap:wrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-width:92px}
.kpi .v{font-size:21px;font-weight:800}.kpi .l{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.danger .v{color:var(--danger)} .kpi.off .v{color:var(--dim)}
.tools{display:flex;align-items:center;gap:6px}
.tools .g{color:var(--dim);font-size:11px;margin-right:2px}
.tools button{background:#0c2236;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer}
.tools button.on{background:var(--accent);color:#04121c}
.tools .add{background:transparent;color:var(--ok);border-color:rgba(57,217,138,.4)}
.body{flex:1;display:flex;min-height:0}
.grid{flex:1;display:grid;gap:10px;padding:12px;overflow:auto;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer;min-height:150px}
.card:hover{border-color:var(--accent)}
.card.alert{border-color:var(--danger);box-shadow:0 0 16px rgba(255,59,59,.3)}
.feed{flex:1;background:linear-gradient(135deg,#0b1622,#060b11);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;position:relative;min-height:90px;overflow:hidden}
.feed img{width:100%;height:100%;object-fit:cover;display:none}
.feed .ph{position:absolute}
.badge{position:absolute;top:8px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;z-index:2}
.b-on{left:8px;background:rgba(57,217,138,.16);color:var(--ok);border:1px solid rgba(57,217,138,.4)}
.b-off{left:8px;background:rgba(91,120,145,.16);color:var(--dim);border:1px solid var(--line)}
.cardbar{display:flex;align-items:center;gap:7px;padding:7px 10px;border-top:1px solid var(--line);font-size:12px}
.cardbar .nm{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{padding:1px 7px;border-radius:5px;font-size:11px;border:1px solid var(--line);white-space:nowrap}
.chip.p{color:var(--accent)} .chip.warn{color:var(--warn);border-color:rgba(255,176,32,.4)} .chip.dng{color:var(--danger);border-color:rgba(255,59,59,.5);background:rgba(255,59,59,.1)}
.ev-time{color:var(--dim);font-size:10px}
.events{width:310px;border-left:1px solid var(--line);background:#070c12;display:flex;flex-direction:column}
.events h3{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.18em;color:var(--dim);border-bottom:1px solid var(--line)}
.filters{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.filters button{flex:1;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:4px;font:inherit;font-size:10px;cursor:pointer}
.filters button.on{color:var(--fg);border-color:var(--accent)}
.evlist{flex:1;overflow:auto;padding:6px 10px}
.ev{padding:8px 10px;border-radius:7px;margin-bottom:6px;border-left:3px solid var(--dim);background:#0a1119}
.ev.hi{border-left-color:var(--warn)} .ev.cr{border-left-color:var(--danger);background:rgba(255,59,59,.07)}
.ev .r1{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.ev .r1 .cam{color:var(--accent)} .ev .r2{color:var(--dim);font-size:11px;margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(2,5,9,.82);display:none;z-index:50;padding:26px}
.modal.show{display:flex}
.mbox{margin:auto;width:min(1100px,94vw);max-height:92vh;background:var(--card);border:1px solid var(--accent);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line)}
.mhead .t{font-weight:800;color:var(--accent);flex:1}
.mhead button{background:#0c2236;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
.mhead button.del{color:var(--danger);border-color:rgba(255,59,59,.4)}
.mbody{flex:1;display:flex;min-height:0}
.mfeed{flex:1;background:#060b11;display:flex;align-items:center;justify-content:center;color:var(--dim);position:relative;min-height:400px}
.mfeed img{max-width:100%;max-height:100%;object-fit:contain}
.mfeed canvas{position:absolute;inset:0;width:100%;height:100%}
.mside{width:250px;border-left:1px solid var(--line);padding:14px;font-size:12px}
.mside h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.mside .row{display:flex;justify-content:space-between;margin:6px 0;padding-bottom:6px;border-bottom:1px solid rgba(80,130,170,.15)}
.mside .row .k{color:var(--dim)}
.form label{display:block;margin:9px 0 3px;font-size:11px;color:var(--dim)}
.form input{width:100%;background:#060b11;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px}
.form .actions{display:flex;gap:8px;margin-top:14px}
.form .actions button{flex:1;background:#0c2236;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;cursor:pointer}
.form .actions .save{background:var(--ok);color:#04140a;border:none}
.testprev{margin-top:10px;font-size:12px}.testprev img{max-width:100%;border-radius:6px;margin-top:6px}
</style></head>
<body>
  <div class="top">
    <div class="brand">VIGENT HUB<small>스마트 카메라 관제</small></div>
    <div class="kpis" id="kpis"></div>
    <div class="tools"><span class="g">보기</span>
      <button data-g="1">1</button><button data-g="4" class="on">4</button><button data-g="9">9</button>
      <button class="add" id="btnAdd">+ 카메라</button></div>
  </div>
  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="events">
      <h3>통합 이벤트 스트림</h3>
      <div class="filters" id="filters">
        <button class="on" data-f="all">전체</button><button data-f="critical">위험</button>
        <button data-f="ppe_missing">PPE</button><button data-f="zone_intrusion">침입</button></div>
      <div class="evlist" id="evlist"><div class="ev"><div class="r2">불러오는 중…</div></div></div>
    </div>
  </div>

  <!-- 확대 뷰 -->
  <div class="modal" id="modal"><div class="mbox">
    <div class="mhead"><span class="t" id="mtitle">CAM</span>
      <button id="mdel" class="del">삭제</button>
      <button id="mclose">✕ 닫기</button></div>
    <div class="mbody">
      <div class="mfeed"><img id="mimg" alt=""><canvas id="mcanvas"></canvas><span class="ph" id="mph">라이브 로딩…</span></div>
      <div class="mside"><h4>카메라 정보</h4><div id="minfo"></div>
        <div style="margin-top:12px;color:var(--dim);font-size:11px">위험구역 편집은 스키마 확정 후(별도 단계).</div></div>
    </div>
  </div></div>

  <!-- 카메라 추가 -->
  <div class="modal" id="addModal"><div class="mbox" style="width:min(460px,92vw)">
    <div class="mhead"><span class="t">카메라 추가</span><button id="addClose">✕</button></div>
    <div class="mbody" style="display:block;padding:16px"><div class="form">
      <label>ID (영문/숫자)</label><input id="fId" placeholder="cam1">
      <label>이름</label><input id="fName" placeholder="정문">
      <label>source (RTSP 주소 / 파일 경로 / 웹캠번호)</label><input id="fSrc" placeholder="rtsp://아이디:비번@192.168.0.10:554/stream1">
      <label>FPS</label><input id="fFps" value="2">
      <div class="actions"><button id="fTest">연결 테스트</button><button id="fSave" class="save">저장·시작</button></div>
      <div class="testprev" id="fPrev"></div>
    </div></div>
  </div></div>

<script>
// ── Phase 2b: 실데이터 배선. 라이브=워커 스냅샷 폴링(파일·RTSP 공통). ──
var $=function(id){return document.getElementById(id);};
var COLS={1:1,4:2,9:3}, SHOW={1:1,4:4,9:99}, cur=4, CAMS=[], EVENTS=[], evFilter='all', openId=null;
function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function api(m,p,body){ return fetch(p,{method:m,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):null}).then(function(r){return r.json();}); }

// 로컬 웹캠(고정 카드, /safety-local 링크)
var LOCAL={id:'__local',name:'로컬 웹캠(CAM-LOCAL)',local:true,online:true};

function kpi(){
  var real=CAMS.filter(function(c){return !c.local;});
  var on=real.filter(function(c){return c.online;}).length;
  var pc=real.reduce(function(a,c){return a+(c.person_count||0);},0);
  var ppe=real.filter(function(c){return c.sig&&c.sig.ppe_missing;}).length;
  var intr=real.filter(function(c){return c.sig&&c.sig.fire_smoke;}).length;
  var K=[['카메라',real.length,''],['온라인',on,'ok'],['오프라인',real.length-on,'off'],
    ['금일 이벤트',EVENTS.length,''],['현재 인원',pc,''],['PPE 미착용',ppe,ppe?'warn':''],['화재/연기',intr,intr?'danger':'']];
  $('kpis').innerHTML=K.map(function(k){return '<div class="kpi '+k[2]+'"><div class="v">'+k[1]+'</div><div class="l">'+k[0]+'</div></div>';}).join('');
}
function chips(c){
  if(c.local) return '<span class="chip p">로컬 상세 ↗</span>';
  if(!c.online) return '<span class="chip">offline</span>';
  var out='';
  if(c.sig&&c.sig.ppe_missing) out+='<span class="chip warn">PPE</span>';
  if(c.sig&&c.sig.fire_smoke) out+='<span class="chip dng">화재</span>';
  out+='<span class="chip p">👤 '+(c.person_count||0)+'</span>';
  return out;
}
function renderGrid(){
  var g=$('grid'); g.style.gridTemplateColumns='repeat('+COLS[cur]+',1fr)';
  g.style.gridAutoRows=cur===1?'1fr':'minmax(150px,1fr)';
  var list=[LOCAL].concat(CAMS.filter(function(c){return !c.local;}));
  list=list.slice(0,SHOW[cur]);
  g.innerHTML=list.map(function(c){
    var badge=c.online?'<span class="badge b-on">online</span>':'<span class="badge b-off">offline</span>';
    var ph=c.local?'◉ CAM-LOCAL 웹캠':(c.online?'':'⚠ 연결 끊김 — 재연결 중…');
    return '<div class="card '+(c.intrusion?'alert':'')+'" data-id="'+esc(c.id)+'">'+
      '<div class="feed">'+badge+'<img data-live="'+esc(c.id)+'"><span class="ph">'+ph+'</span></div>'+
      '<div class="cardbar"><span class="nm">'+esc(c.name)+'</span>'+chips(c)+'</div></div>';
  }).join('');
  [].forEach.call(g.querySelectorAll('.card'),function(el){ el.onclick=function(){ var id=el.dataset.id;
    if(id==='__local'){ location.href='/safety-local'; return; } openModal(id); }; });
  refreshThumbs();
}
function refreshThumbs(){   // 워커 스냅샷 폴링(카드 미리보기)
  [].forEach.call(document.querySelectorAll('.feed img[data-live]'),function(img){
    var id=img.dataset.live; if(id==='__local') return;
    var c=CAMS.filter(function(x){return x.id===id;})[0];
    if(!c||!c.online){ img.style.display='none'; return; }
    img.onload=function(){ img.style.display='block'; };
    img.onerror=function(){ img.style.display='none'; };
    img.src='/cameras/'+encodeURIComponent(id)+'/snapshot?t='+Date.now();
  });
}
function renderEvents(){
  var f=evFilter, list=EVENTS.filter(function(e){ return f==='all'|| (f==='critical'?e.level==='critical'||e.level==='high':e.rule===f); });
  $('evlist').innerHTML=list.length?list.map(function(e){
    var cls=e.level==='critical'?'cr':(e.level==='high'?'hi':'');
    return '<div class="ev '+cls+'"><div class="r1"><span>'+esc(e.note||e.rule)+'</span><span class="cam">'+esc(e.site||'')+'</span></div>'+
      '<div class="r2">'+esc(e.rule)+' · '+esc(e.time||e.ts||'')+'</div></div>';
  }).join(''):'<div class="ev"><div class="r2">이벤트 없음</div></div>';
}
function poll(){
  api('GET','/cameras').then(function(j){
    var st={}; (j.cameras||[]).forEach(function(c){ st[c.id]=c; });
    CAMS=(j.cameras||[]);
    // 검출/침입 상태(온라인만)
    var proms=CAMS.filter(function(c){return c.online;}).map(function(c){
      return api('GET','/cameras/'+encodeURIComponent(c.id)+'/detections').then(function(d){
        c.person_count=d.person_count; c.sig=d.signals||{}; c._dets=d.detections||[]; c.intrusion=!!(c.sig&&c.sig.fire_smoke);
      }).catch(function(){});
    });
    Promise.all(proms).then(function(){ kpi(); renderGrid(); });
  }).catch(function(){});
  api('GET','/safety/auto/feed?hours=24&limit=40').then(function(j){
    EVENTS=j.feed||j.events||[]; renderEvents(); kpi();
  }).catch(function(){});
}

// 확대 뷰
var modalTimer=null;
function openModal(id){
  openId=id; var c=CAMS.filter(function(x){return x.id===id;})[0]||{};
  $('mtitle').textContent=c.name||id; $('modal').classList.add('show');
  function tick(){
    var img=$('mimg'), ph=$('mph');
    img.onload=function(){ img.style.display='block'; ph.style.display='none'; drawOverlay(); };
    img.onerror=function(){ img.style.display='none'; ph.textContent='오프라인/워밍업'; ph.style.display='block'; };
    img.src='/cameras/'+encodeURIComponent(id)+'/snapshot?t='+Date.now();
    api('GET','/cameras/'+encodeURIComponent(id)+'/detections').then(function(d){ $('mimg')._dets=d.detections||[];
      var cc=CAMS.filter(function(x){return x.id===id;})[0]||{};
      $('minfo').innerHTML=[['상태',cc.online?'<span style="color:var(--ok)">online</span>':'<span style="color:var(--dim)">offline</span>'],
        ['인원',d.person_count||0],['PPE',(d.signals&&d.signals.ppe_missing)?'<span style="color:var(--warn)">미착용</span>':'정상'],
        ['FPS',cc.fps_live||cc.fps||'-'],['재연결',cc.reconnects||0],['source','<span style="font-size:10px">'+esc(cc.source||'')+'</span>']]
        .map(function(r){return '<div class="row"><span class="k">'+r[0]+'</span><span>'+r[1]+'</span></div>';}).join('');
    }).catch(function(){});
  }
  tick(); modalTimer=setInterval(tick,1200);
}
function drawOverlay(){
  var img=$('mimg'), cv=$('mcanvas'); if(!img.naturalWidth) return;
  cv.width=img.clientWidth; cv.height=img.clientHeight;
  var ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
  var iw=img.clientWidth, ih=img.clientHeight;
  (img._dets||[]).forEach(function(d){
    var b=d.bbox, x=b[0]*iw, y=b[1]*ih, w=(b[2]-b[0])*iw, h=(b[3]-b[1])*ih;
    var col=/^no-/i.test(d.class)?'#ff3b3b':(d.class==='person'?'#39d0ff':'#39d98a');
    ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);
    ctx.font='11px monospace'; ctx.fillStyle=col; ctx.fillText(d.class+' '+Math.round((d.score||0)*100)+'%',x+2,y-3);
  });
}
function closeModal(){ $('modal').classList.remove('show'); if(modalTimer)clearInterval(modalTimer); modalTimer=null; openId=null; }
$('mclose').onclick=closeModal;
$('modal').onclick=function(e){ if(e.target===this) closeModal(); };
$('mdel').onclick=function(){ if(openId&&confirm('카메라 삭제?')){ api('DELETE','/cameras/'+encodeURIComponent(openId)).then(function(){ closeModal(); poll(); }); } };

// 추가 모달
$('btnAdd').onclick=function(){ $('fPrev').innerHTML=''; $('addModal').classList.add('show'); };
$('addClose').onclick=function(){ $('addModal').classList.remove('show'); };
$('addModal').onclick=function(e){ if(e.target===this) this.classList.remove('show'); };
function addPayload(en){ return {id:$('fId').value.trim(),name:$('fName').value.trim()||$('fId').value.trim(),source:$('fSrc').value.trim(),fps:parseFloat($('fFps').value)||2,enabled:en}; }
$('fTest').onclick=function(){
  var p=addPayload(false); if(!p.id||!p.source){ alert('ID·source 필요'); return; }
  $('fPrev').innerHTML='테스트 중…';
  api('POST','/cameras',p).then(function(){ return api('POST','/cameras/'+encodeURIComponent(p.id)+'/test'); }).then(function(t){
    $('fPrev').innerHTML=t.ok?('<span style="color:var(--ok)">✔ 연결 성공</span><img src="'+t.snapshot+'">'):('<span style="color:var(--danger)">✕ 실패: '+esc(t.error)+'</span>');
  }).catch(function(){ $('fPrev').innerHTML='<span style="color:var(--danger)">테스트 오류</span>'; });
};
$('fSave').onclick=function(){
  var p=addPayload(true); if(!p.id||!p.source){ alert('ID·source 필요'); return; }
  api('POST','/cameras',p).then(function(){ $('addModal').classList.remove('show'); poll(); });
};

// 그리드/필터 토글
[].forEach.call(document.querySelectorAll('.tools button[data-g]'),function(b){ b.onclick=function(){
  [].forEach.call(document.querySelectorAll('.tools button[data-g]'),function(x){x.classList.remove('on');});
  b.classList.add('on'); cur=+b.dataset.g; renderGrid(); };});
[].forEach.call(document.querySelectorAll('#filters button'),function(b){ b.onclick=function(){
  [].forEach.call(document.querySelectorAll('#filters button'),function(x){x.classList.remove('on');});
  b.classList.add('on'); evFilter=b.dataset.f; renderEvents(); };});

poll(); setInterval(poll,2000); setInterval(refreshThumbs,1300);
</script>
</body></html>
