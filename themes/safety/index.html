<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGENT Safety — 산업안전 관제 콘솔</title>
<!-- MediaPipe Pose (브라우저 측 저지연 스켈레톤, §4) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<style>
  :root{ --bg:#05070a; --fg:#cfe9ff; --dim:#5b7891; --ok:#39d98a; --warn:#ffb020; --danger:#ff3b3b; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font-family:"SF Mono","Consolas","Menlo",monospace; overflow:hidden; }
  #stage{ position:relative; width:100vw; height:100vh; background:#000; }
  #videoEl, #outputCanvas{ position:absolute; inset:0; width:100%; height:100%;
        object-fit:cover; transform:scaleX(-1); }  /* 영상·캔버스 동일 mirror */
  #videoEl{ z-index:1; } #outputCanvas{ z-index:2; }
  /* CCTV 분위기 — 스캔라인 + 비네팅 */
  #fx{ position:absolute; inset:0; z-index:3; pointer-events:none;
       background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.12) 3px),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  /* 검은 반투명 상태 패널(blur) */
  .panel{ position:absolute; z-index:4; background:rgba(5,10,16,.62);
        border:1px solid rgba(80,130,170,.35); border-radius:8px;
        backdrop-filter:blur(6px); padding:12px 14px; font-size:12px; line-height:1.7; }
  #statusPanel{ top:14px; left:14px; width:248px; }
  #detPanel{ top:14px; right:14px; width:220px; }
  #logPanel{ left:14px; bottom:14px; width:60%; max-width:680px; height:128px;
        overflow:hidden; font-size:11px; color:#9fd0ff; }
  .panel h2{ margin:0 0 8px; font-size:11px; letter-spacing:.18em; color:var(--dim);
        border-bottom:1px solid rgba(80,130,170,.3); padding-bottom:6px; }
  .row{ display:flex; justify-content:space-between; gap:8px; }
  .row b{ color:#eaf6ff; font-weight:600; }
  .tag-ok{ color:var(--ok); } .tag-warn{ color:var(--warn); } .tag-danger{ color:var(--danger); }
  /* 종합 위험등급 신호바 */
  #riskBox{ margin-top:8px; padding:8px; border-radius:6px; text-align:center;
        background:rgba(57,217,138,.12); border:1px solid var(--ok); }
  #riskBox.high,#riskBox.critical{ background:rgba(255,59,59,.16); border-color:var(--danger); }
  #riskBox.medium{ background:rgba(255,176,32,.14); border-color:var(--warn); }
  #riskLevel{ font-size:18px; font-weight:700; letter-spacing:.1em; }
  #bar{ height:6px; margin-top:6px; border-radius:3px; background:#0c1620; overflow:hidden; }
  #barFill{ height:100%; width:0%; background:var(--ok); transition:width .25s,background .25s; }
  /* HUD 상단 — REC / 시계 / CAM */
  #hud{ position:absolute; z-index:4; top:14px; left:50%; transform:translateX(-50%);
        display:flex; gap:18px; align-items:center; font-size:12px; color:#bfe0ff; }
  #rec{ color:var(--danger); font-weight:700; }
  #rec::before{ content:"●"; margin-right:5px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:.15; } }
  /* 코너 브래킷 */
  .br{ position:absolute; z-index:4; width:26px; height:26px; border:2px solid rgba(120,170,210,.5); }
  .br.tl{ top:8px; left:8px; border-right:0; border-bottom:0; }
  .br.tr{ top:8px; right:8px; border-left:0; border-bottom:0; }
  .br.bl{ bottom:8px; left:8px; border-right:0; border-top:0; }
  .br.br2{ bottom:8px; right:8px; border-left:0; border-top:0; }
  #banner{ position:absolute; z-index:5; top:46%; left:50%; transform:translate(-50%,-50%);
        display:none; padding:10px 26px; border-radius:8px; font-size:22px; font-weight:800;
        letter-spacing:.15em; background:rgba(255,59,59,.85); color:#fff; }
  #noSignal{ position:absolute; inset:0; z-index:6; display:flex; align-items:center;
        justify-content:center; color:#456; font-size:20px; letter-spacing:.3em; background:#000; }
  button{ font-family:inherit; }
  #startBtn{ position:absolute; z-index:7; left:50%; top:55%; transform:translate(-50%,-50%);
        padding:14px 30px; font-size:15px; background:#0c2236; color:#bfe0ff;
        border:1px solid var(--dim); border-radius:8px; cursor:pointer; }
  /* 위험구역 설정 도구 */
  #zoneTools{ bottom:14px; right:14px; width:196px; }
  #zoneTools button{ display:block; width:100%; margin-top:6px; padding:8px;
        font-size:12px; background:#0c2236; color:#bfe0ff;
        border:1px solid var(--dim); border-radius:6px; cursor:pointer; }
  #zoneTools button#zoneDraw.on{ background:var(--warn); color:#1a1206; border-color:var(--warn); }
  #zoneHint{ font-size:11px; color:var(--dim); line-height:1.5; }
  /* 그리기 모드일 때 영상 위 커서를 십자로 */
  #stage.drawing #outputCanvas{ cursor:crosshair; }
</style>
</head>
<body>
<div id="stage">
  <video id="videoEl" autoplay muted playsinline></video>
  <canvas id="outputCanvas"></canvas>
  <div id="fx"></div>
  <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br br2"></div>

  <div id="hud">
    <span id="rec">REC</span>
    <span id="clock">--:--:--</span>
    <span>CAM01 · VIGENT-SAFETY</span>
  </div>

  <div id="statusPanel" class="panel">
    <h2>SYSTEM STATUS</h2>
    <div class="row"><span>FPS</span><b id="sFps">0</b></div>
    <div class="row"><span>FRAME</span><b id="sFrame">0</b></div>
    <div class="row"><span>작업자(WORKER)</span><b id="sWorker">0</b></div>
    <div class="row"><span>자세(몸통각)</span><b id="sPose">--</b></div>
    <div class="row"><span>PPE</span><b id="sPpe" class="tag-warn">폴백</b></div>
    <div class="row"><span>위험구역(ZONE)</span><b id="sZone">OUT</b></div>
    <div id="riskBox"><div id="riskLevel">SAFE</div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="riskMode" style="font-size:10px;color:var(--dim);margin-top:4px;">규칙 폴백</div>
    </div>
  </div>

  <div id="detPanel" class="panel">
    <h2>DETECTIONS</h2>
    <div id="detList"><div class="row"><span>대기 중…</span></div></div>
  </div>

  <div id="logPanel" class="panel">
    <h2>CONSOLE</h2>
    <div id="logBody"></div>
  </div>

  <div id="zoneTools" class="panel">
    <h2>위험구역 설정</h2>
    <div id="zoneHint">‘그리기’를 켜고 영상에<br>꼭짓점을 차례로 클릭 →<br>‘저장’</div>
    <button id="zoneDraw">✏️ 그리기 시작</button>
    <button id="zoneUndo">↶ 한 점 취소</button>
    <button id="zoneSave">✓ 저장</button>
    <button id="zoneClear">🗑 구역 지우기</button>
  </div>

  <div id="banner">⚠ DANGER</div>
  <div id="noSignal">NO SIGNAL</div>
  <button id="startBtn">▶ 카메라 시작</button>
</div>

<!-- §8 기능안전 경계 명시: 본 화면의 비전 판정은 보조·감시 신호이며,
     프레스/전단기 비상정지의 1차 책임은 인증 하드웨어(Type 4 광전자식 방호장치·안전 PLC)에 있다. -->
<script>
const video=document.getElementById('videoEl'), canvas=document.getElementById('outputCanvas');
const ctx=canvas.getContext('2d');
let dangerZone=[];          // 저장된 위험구역 폴리곤(정규화 좌표)
let draftZone=[];           // 그리는 중인 임시 폴리곤
let drawMode=false;         // 그리기 모드 on/off
let frameN=0, lastT=performance.now(), fps=0, lastJudge=0, lastLevel='safe';

const $=id=>document.getElementById(id);
function log(msg){ const b=$('logBody');
  b.innerHTML = `<div>${new Date().toLocaleTimeString('en-GB')}  ${msg}</div>` + b.innerHTML;
  if(b.childElementCount>40) b.removeChild(b.lastChild); }

// 시계
setInterval(()=>{ $('clock').textContent=new Date().toLocaleTimeString('en-GB'); },1000);

// 위험구역 좌표 로드(코어 엔드포인트)
async function loadZone(){
  try{ const r=await fetch('/zone/danger'); const j=await r.json();
       dangerZone=(j.points||[]).map(p=>[p.x,p.y]);
       log(`zone loaded points=${dangerZone.length}`);
  }catch(e){ log('zone load 실패 → 빈 구역'); }
}

// 점-다각형 내부판정(ray casting), 정규화 좌표
function inPolygon(x,y,poly){
  if(poly.length<3) return false;
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1], xj=poly[j][0],yj=poly[j][1];
    const hit=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(hit) inside=!inside;
  }
  return inside;
}

// 몸통 기울기(수직 대비 각도, 도)
function torsoAngle(lm){
  const sh={x:(lm[11].x+lm[12].x)/2, y:(lm[11].y+lm[12].y)/2};
  const hp={x:(lm[23].x+lm[24].x)/2, y:(lm[23].y+lm[24].y)/2};
  const dx=sh.x-hp.x, dy=sh.y-hp.y;              // 엉덩이→어깨 벡터
  return Math.abs(Math.atan2(dx, -dy))*180/Math.PI;  // 수직(위)과의 각
}

function drawZone(intrusion){
  if(dangerZone.length<3) return;
  ctx.save();
  ctx.beginPath();
  dangerZone.forEach(([x,y],i)=>{ const px=x*canvas.width, py=y*canvas.height;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  ctx.closePath();
  ctx.fillStyle = intrusion ? 'rgba(255,59,59,.28)' : 'rgba(255,176,32,.12)';
  ctx.strokeStyle = intrusion ? '#ff3b3b' : '#ffb020';
  ctx.lineWidth=2; ctx.fill(); ctx.stroke();
  ctx.restore();
}

// 그리는 중인 임시 폴리곤(점 + 선) 미리보기
function drawDraft(){
  if(!draftZone.length) return;
  ctx.save();
  ctx.beginPath();
  draftZone.forEach(([x,y],i)=>{ const px=x*canvas.width, py=y*canvas.height;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  ctx.strokeStyle='#39d98a'; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.stroke();
  ctx.setLineDash([]);
  draftZone.forEach(([x,y],i)=>{ const px=x*canvas.width, py=y*canvas.height;
    ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fillStyle='#39d98a'; ctx.fill();
    ctx.fillStyle='#05070a'; ctx.font='10px monospace'; ctx.fillText(i+1, px-3, py+3); });
  ctx.restore();
}

// Analyst 가산 판단 호출(모델 신호 없음 → 규칙 폴백)
async function judge(signals){
  try{
    const r=await fetch('/safety/judge',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({signals})});   // dl 생략 → 백엔드가 휴리스틱 폴백
    return await r.json();
  }catch(e){ return null; }
}

function applyRisk(j){
  const lv=(j&&j.level)||'safe';
  const box=$('riskBox'), score=(j&&j.score)||0;
  box.className=lv;
  $('riskLevel').textContent=lv.toUpperCase();
  $('riskLevel').className = (lv==='high'||lv==='critical')?'tag-danger':(lv==='medium'?'tag-warn':'tag-ok');
  $('barFill').style.width=Math.min(100,score)+'%';
  $('barFill').style.background = (lv==='high'||lv==='critical')?'var(--danger)':(lv==='medium'?'var(--warn)':'var(--ok)');
  $('riskMode').textContent = (j&&j.used_dl)?'규칙+딥러닝 가산':'규칙 폴백(딥러닝 미가산)';
  $('banner').style.display = (lv==='high'||lv==='critical')?'block':'none';
  // DETECTIONS 패널
  const fired=(j&&j.fired)||[];
  $('detList').innerHTML = fired.length
    ? fired.map(f=>`<div class="row"><span>${f.rule}</span><b class="${f.severity==='medium'?'tag-warn':'tag-danger'}">${f.severity}</b></div>`).join('')
    : '<div class="row"><span>위반 없음</span><b class="tag-ok">CLEAR</b></div>';
  if(lv!==lastLevel){ log(`alert=${lv} score=${score}`); lastLevel=lv; }
}

// MediaPipe Pose
const pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
pose.setOptions({modelComplexity:1, smoothLandmarks:true, minDetectionConfidence:.5, minTrackingConfidence:.5});

pose.onResults(async (res)=>{
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // FPS
  frameN++; const now=performance.now();
  if(now-lastT>=500){ fps=Math.round(frameN*1000/(now-lastT)); frameN=0; lastT=now; $('sFps').textContent=fps; }
  $('sFrame').textContent = (+$('sFrame').textContent)+1;

  const lm=res.poseLandmarks;
  let signals={zone_intrusion:false, ppe_missing:false, torso_angle:0, fall_temporal:false, hand_in_machine_zone:false};
  let intrusion=false;

  if(lm){
    $('sWorker').textContent='1';
    // 스켈레톤(글로우 + 1.4px) — drawing_utils
    ctx.save();
    drawConnectors(ctx, lm, POSE_CONNECTIONS, {color:'rgba(80,200,255,.85)', lineWidth:1.4});
    drawLandmarks(ctx, lm, {color:'#eaf6ff', lineWidth:.6, radius:2});
    ctx.restore();

    // 신호 계산
    const foot={x:(lm[27].x+lm[28].x)/2, y:(lm[27].y+lm[28].y)/2};  // 발 중점
    intrusion=inPolygon(foot.x, foot.y, dangerZone);
    const ang=torsoAngle(lm);
    signals.zone_intrusion=intrusion;
    signals.torso_angle=ang;
    $('sPose').textContent=ang.toFixed(0)+'°';
    $('sPose').className = ang>60?'tag-danger':'';
    $('sZone').textContent = intrusion?'IN':'OUT';
    $('sZone').className = intrusion?'tag-danger':'tag-ok';
  } else {
    $('sWorker').textContent='0'; $('sPose').textContent='--'; $('sZone').textContent='OUT';
  }

  drawZone(intrusion);
  drawDraft();

  // 그리기 모드 중엔 판단 호출을 멈춘다(구역 설정에 집중)
  if(drawMode) return;

  // 판단(과도호출 방지: ~300ms 간격)
  if(now-lastJudge>300){ lastJudge=now;
    const j=await judge(signals);
    if(j) applyRisk(j);
    log(`frame=${$('sFrame').textContent} worker=${lm?1:0} zone=${intrusion?'IN':'OUT'} torso=${signals.torso_angle.toFixed(0)}`);
  }
});

// ── 위험구역 직접 설정 ──
const stage=document.getElementById('stage');

// 화면 클릭 좌표 → 이미지 정규화 좌표(영상이 좌우반전이라 x 를 뒤집는다)
function screenToImage(ev){
  const r=canvas.getBoundingClientRect();
  let fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
  fx=1-fx;  // mirror 보정
  return [Math.min(1,Math.max(0,fx)), Math.min(1,Math.max(0,fy))];
}

canvas.addEventListener('click',(ev)=>{
  if(!drawMode) return;
  draftZone.push(screenToImage(ev));
  $('zoneHint').textContent=`점 ${draftZone.length}개 — 3개 이상이면 저장 가능`;
});

$('zoneDraw').addEventListener('click',()=>{
  drawMode=!drawMode;
  $('zoneDraw').classList.toggle('on',drawMode);
  $('zoneDraw').textContent = drawMode ? '■ 그리기 중…' : '✏️ 그리기 시작';
  stage.classList.toggle('drawing',drawMode);
  if(drawMode){ draftZone=[]; $('zoneHint').textContent='영상에 꼭짓점을 클릭하세요'; log('zone 그리기 시작'); }
});

$('zoneUndo').addEventListener('click',()=>{
  draftZone.pop(); $('zoneHint').textContent=`점 ${draftZone.length}개`;
});

$('zoneClear').addEventListener('click', async ()=>{
  draftZone=[]; dangerZone=[];
  await fetch('/zone/danger',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({points:[]})});
  $('zoneHint').textContent='구역을 지웠습니다'; log('zone 지움');
});

$('zoneSave').addEventListener('click', async ()=>{
  if(draftZone.length<3){ $('zoneHint').textContent='점이 3개 이상이어야 저장됩니다'; return; }
  const points=draftZone.map(([x,y])=>({x,y}));
  const r=await fetch('/zone/danger',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({points})});
  const j=await r.json();
  if(j.ok){
    dangerZone=draftZone.slice(); draftZone=[];
    drawMode=false; $('zoneDraw').classList.remove('on');
    $('zoneDraw').textContent='✏️ 그리기 시작'; stage.classList.remove('drawing');
    $('zoneHint').textContent=`저장 완료 (${j.count}점)`; log(`zone 저장 ${j.count}점`);
  }
});

// 카메라 시작(보안 컨텍스트 필요 → localhost 서버에서 실행)
$('startBtn').addEventListener('click', async ()=>{
  $('startBtn').style.display='none'; $('noSignal').style.display='none';
  await loadZone();
  const cam=new Camera(video,{ onFrame:async()=>{ await pose.send({image:video}); }, width:1280, height:720 });
  cam.start().then(()=>log('camera started')).catch(e=>{ $('noSignal').style.display='flex'; log('camera 실패: '+e); });
});
</script>
</body>
</html>
