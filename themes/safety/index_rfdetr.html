<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGENT Safety — rf-detr 관제 콘솔</title>
<style>
  :root{ --bg:#05070a; --fg:#cfe9ff; --dim:#5b7891; --ok:#39d98a; --warn:#ffb020; --danger:#ff3b3b; --accent:#39d0ff; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#000; color:var(--fg); font-family:"SF Mono","Consolas","Menlo",monospace; overflow:hidden; }
  #stage{ position:fixed; inset:0; }
  #videoEl,#outputCanvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #videoEl{ z-index:1; } #outputCanvas{ z-index:2; }
  #fx{ position:absolute; inset:0; z-index:3; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.12) 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%); }
  .panel{ position:absolute; z-index:5; background:rgba(5,10,16,.62); border:1px solid rgba(80,130,170,.35);
    border-radius:8px; backdrop-filter:blur(6px); padding:11px 13px; font-size:12px; line-height:1.65; }
  .panel h2{ margin:0 0 7px; font-size:10px; letter-spacing:.18em; color:var(--dim);
    border-bottom:1px solid rgba(80,130,170,.3); padding-bottom:5px; }
  #statusPanel{ top:54px; left:14px; width:230px; }
  #detPanel{ top:54px; right:14px; width:230px; max-height:40vh; overflow:auto; }
  #riskPanel{ bottom:14px; right:14px; width:300px; }
  #riskPanel.hot{ border-color:var(--danger); box-shadow:0 0 18px rgba(255,59,59,.4); }
  .row{ display:flex; justify-content:space-between; gap:8px; }
  .row b{ color:#eaf6ff; } .tag-ok{ color:var(--ok); } .tag-warn{ color:var(--warn); } .tag-danger{ color:var(--danger); }
  #hud{ position:absolute; z-index:6; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:18px;
    align-items:center; font-size:12px; color:#bfe0ff; background:rgba(5,10,16,.55);
    border:1px solid rgba(80,130,170,.35); border-radius:8px; padding:7px 16px; backdrop-filter:blur(6px); }
  #rec{ color:var(--danger); font-weight:700; } #rec::before{ content:"●"; margin-right:5px; animation:bl 1s steps(1) infinite; }
  @keyframes bl{ 50%{opacity:.15;} }
  #brand{ position:absolute; z-index:6; left:14px; top:14px; font-weight:700; color:var(--accent);
    letter-spacing:.12em; background:rgba(5,10,16,.55); border:1px solid rgba(80,130,170,.35); border-radius:8px; padding:8px 12px; }
  #zoneTools{ bottom:14px; left:14px; width:200px; }
  #zoneTools button{ display:block; width:100%; margin-top:5px; padding:7px; font-size:12px; font-family:inherit;
    background:#0c2236; color:var(--accent); border:1px solid rgba(80,130,170,.35); border-radius:6px; cursor:pointer; }
  #zoneTools button.on{ background:var(--warn); color:#1a1206; }
  #banner{ position:absolute; z-index:7; top:46%; left:50%; transform:translate(-50%,-50%); display:none;
    padding:10px 26px; border-radius:8px; font-size:22px; font-weight:800; letter-spacing:.12em; background:rgba(255,59,59,.85); color:#fff; }
  #startBtn{ position:absolute; z-index:8; left:50%; top:55%; transform:translate(-50%,-50%); padding:14px 30px;
    font-size:15px; font-family:inherit; background:#0c2236; color:var(--accent); border:1px solid var(--dim); border-radius:8px; cursor:pointer; }
  #riskItem{ margin-top:4px; } #riskItem div{ margin:3px 0; } #riskItem .k{ color:var(--dim); }
</style>
</head>
<body>
<div id="stage">
  <video id="videoEl" autoplay muted playsinline></video>
  <canvas id="outputCanvas"></canvas>
  <div id="fx"></div>
  <div id="brand">🛡️ VIGENT · SAFETY (rf-detr)</div>
  <div id="hud"><span id="rec">REC</span><span id="clock">--:--:--</span><span id="dev">CAM01</span></div>

  <div id="statusPanel" class="panel">
    <h2>SYSTEM STATUS</h2>
    <div class="row"><span>FPS</span><b id="sFps">0</b></div>
    <div class="row"><span>엔진</span><b id="sEngine">rf-detr</b></div>
    <div class="row"><span>장치</span><b id="sDevice">-</b></div>
    <div class="row"><span>작업자(WORKER)</span><b id="sWorker">0</b></div>
    <div class="row"><span>위험구역 침입</span><b id="sZone" class="tag-ok">0</b></div>
  </div>

  <div id="detPanel" class="panel"><h2>DETECTIONS</h2><div id="detList"><div class="row"><span>대기 중…</span></div></div></div>

  <div id="riskPanel" class="panel"><h2>⚠ AI 위험요약 (VLM)</h2>
    <div id="riskItem"><div class="k">침입 발생 시 자동 분석됩니다.</div></div>
  </div>

  <div id="zoneTools" class="panel"><h2>위험구역 설정</h2>
    <div id="zoneHint" style="font-size:11px;color:var(--dim)">‘그리기’ → 영상 클릭 → ‘저장’</div>
    <button id="zoneDraw">✏️ 그리기 시작</button>
    <button id="zoneSave">✓ 저장</button>
    <button id="zoneClear">🗑 지우기</button>
  </div>

  <div id="banner">⚠ 위험구역 침입</div>
  <button id="startBtn">▶ 카메라 시작</button>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$('videoEl'), canvas=$('outputCanvas'), ctx=canvas.getContext('2d');
let dangerZone=[], draftZone=[], drawMode=false;
let lastDetect=0, detecting=false, lastVlm=0, vlmBusy=false;
let frameN=0, lastT=performance.now(), fps=0, lastBanner=false;
const DETECT_MS=350, VLM_COOLDOWN=12000;

setInterval(()=>{ $('clock').textContent=new Date().toLocaleTimeString('en-GB'); },1000);

async function loadZone(){
  try{ const j=await (await fetch('/zone/danger')).json(); dangerZone=(j.points||[]).map(p=>[p.x,p.y]); }catch(e){}
}
function screenToImage(ev){ const r=canvas.getBoundingClientRect();
  let fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height; fx=1-fx;
  return [Math.min(1,Math.max(0,fx)),Math.min(1,Math.max(0,fy))]; }

function drawPoly(zone,stroke,fill){ if(zone.length<3)return; ctx.save(); ctx.beginPath();
  zone.forEach(([x,y],i)=>{const px=x*canvas.width,py=y*canvas.height; i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); ctx.restore(); }

// 캔버스가 mirror 라 글자는 한 번 더 뒤집어 정상 표시
function mtext(t,x,y){ ctx.save(); ctx.translate(x,y); ctx.scale(-1,1);
  ctx.fillText(String(t), -ctx.measureText(String(t)).width, 0); ctx.restore(); }

// 라벨 카테고리별 색
function boxColor(label,inZone){
  if(inZone) return '#ff3b3b';                       // 위험구역 침입=빨강
  const L=label.toLowerCase();
  if(L==='person') return '#39d98a';                 // 사람=초록
  if(['car','truck','bus','motorcycle','bicycle','train','boat','airplane','horse','cow','dog','cat','bird','sheep','elephant','bear'].includes(L)) return '#ffb020'; // 이동체/동물=주황
  if(['chair','couch','bed','dining table','toilet','bench','potted plant','tv','laptop','mouse','keyboard','remote','cell phone'].includes(L)) return '#39d0ff'; // 가구/전자=시안
  if(['bottle','cup','bowl','fork','knife','spoon','wine glass'].includes(L)) return '#ffd23a'; // 식기=노랑
  return '#9aa7ff';
}
// 2.2c: 박스마다 트랙 id 별 고유색(황금각 137.5°). id 미부여(-1)면 회색. 침입은 색 무관하게 선 +1.
function colorForId(n){ if(n==null||n<0) return '#9aa7b0'; return 'hsl('+((n*137.508)%360).toFixed(0)+',80%,58%)'; }
function drawBoxes(dets){
  // 2.2b·2.2c: 선 얇게(640→1280·소수 허용)·글씨 축소(index_local 통일). 굵게=DIV↓.
  const LW=Math.max(0.5,canvas.width/1280), FPX=Math.max(10,Math.round(canvas.width/80));
  ctx.save(); ctx.font=FPX+'px monospace'; ctx.lineWidth=LW; ctx.textBaseline='bottom';
  dets.forEach(d=>{ const [x1,y1,x2,y2]=d.bbox;
    const px=x1*canvas.width, py=y1*canvas.height, pw=(x2-x1)*canvas.width, ph=(y2-y1)*canvas.height;
    const col=colorForId(d.id);                       // 2.2c: 트랙 id 별 고유색
    ctx.lineWidth=LW+(d.in_zone?1:0);                 // 침입은 색 무관하게 선 +1(식별성 유지·안전 제품)
    ctx.strokeStyle=col; ctx.strokeRect(px,py,pw,ph);
    const tag=`${d.label} ${(d.conf*100).toFixed(0)}%`; const tw=ctx.measureText(tag).width+6, bh=FPX+3;
    ctx.fillStyle=col; ctx.fillRect(px,py-bh,tw,bh); ctx.fillStyle='#05070a'; mtext(tag,px+3,py-3);
  });
  ctx.restore();
}

function captureRaw(){ const t=document.createElement('canvas'); t.width=canvas.width; t.height=canvas.height;
  // 이중 미러 수정: CSS(#videoEl,#outputCanvas scaleX(-1))가 화면을 이미 좌우반전하므로
  //   여기서 또 반전(translate/scale)하면 백엔드가 거울 프레임 기준 bbox를 반환→캔버스 CSS 반전과 겹쳐
  //   박스가 좌우 반대에 그려지고, 비반전 공간에 저장된 위험구역과도 어긋난다. 원본 프레임 그대로 전송.
  const c=t.getContext('2d'); c.drawImage(video,0,0,t.width,t.height);
  return t.toDataURL('image/jpeg',0.8); }

async function detectLoop(){
  if(detecting) return; const now=performance.now(); if(now-lastDetect<DETECT_MS) return;
  detecting=true; lastDetect=now;
  try{
    const j=await (await fetch('/rfdetr/frame',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:captureRaw()})})).json();
    window._dets=j.detections||[];
    $('sWorker').textContent=j.person_count||0;
    $('sDevice').textContent=j.device||'-';
    const nin=j.intrusion?.count||0;
    $('sZone').textContent=nin; $('sZone').className=nin>0?'tag-danger':'tag-ok';
    $('detList').innerHTML=(j.detections||[]).length
      ? j.detections.map(d=>`<div class="row"><span>${d.label} ${(d.conf*100).toFixed(0)}%</span>${d.in_zone?'<b class="tag-danger">침입</b>':''}</div>`).join('')
      : '<div class="row"><span>탐지 없음</span></div>';
    $('banner').style.display=nin>0?'block':'none';
    // 침입 시 VLM 위험요약(쿨다운)
    if(nin>0 && !vlmBusy && performance.now()-lastVlm>VLM_COOLDOWN){ lastVlm=performance.now(); runVlm(); }
  }catch(e){}
  finally{ detecting=false; }
}

async function runVlm(){
  vlmBusy=true; $('riskPanel').classList.add('hot');
  $('riskItem').innerHTML='<div class="k">🧠 AI 분석 중…</div>';
  try{
    const j=await (await fetch('/rfdetr/vlm',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:captureRaw()})})).json();
    const lvl=j.위험등급||'-';
    $('riskItem').innerHTML=`
      <div><span class="k">위험등급</span> <b class="${lvl==='높음'?'tag-danger':(lvl==='중간'?'tag-warn':'tag-ok')}">${lvl}</b></div>
      <div><span class="k">위험요인</span> ${j.위험요인||'-'}</div>
      <div><span class="k">권고조치</span> ${j.권고조치||'-'}</div>`;
  }catch(e){ $('riskItem').innerHTML='<div class="k">분석 실패</div>'; }
  finally{ vlmBusy=false; }
}

function render(){
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  frameN++; const now=performance.now();
  if(now-lastT>=500){ fps=Math.round(frameN*1000/(now-lastT)); frameN=0; lastT=now; $('sFps').textContent=fps; }
  if(window._dets) drawBoxes(window._dets);
  const intr=(window._dets||[]).some(d=>d.in_zone);
  drawPoly(dangerZone, intr?'#ff3b3b':'#ffb020', intr?'rgba(255,59,59,.22)':'rgba(255,176,32,.1)');
  if(draftZone.length) drawPoly(draftZone, '#39d98a', null);
  if(!drawMode) detectLoop();
  requestAnimationFrame(render);
}

// 위험구역 그리기
canvas.addEventListener('click',ev=>{ if(!drawMode)return; draftZone.push(screenToImage(ev));
  $('zoneHint').textContent=`점 ${draftZone.length}개`; });
$('zoneDraw').addEventListener('click',()=>{ drawMode=!drawMode; $('zoneDraw').classList.toggle('on',drawMode);
  $('zoneDraw').textContent=drawMode?'■ 그리는 중':'✏️ 그리기 시작'; if(drawMode){draftZone=[];$('zoneHint').textContent='영상 클릭';} });
$('zoneSave').addEventListener('click',async()=>{ if(draftZone.length<3){$('zoneHint').textContent='3점 이상 필요';return;}
  await fetch('/zone/danger',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({points:draftZone.map(([x,y])=>({x,y}))})});
  dangerZone=draftZone.slice(); draftZone=[]; drawMode=false; $('zoneDraw').classList.remove('on');
  $('zoneDraw').textContent='✏️ 그리기 시작'; $('zoneHint').textContent='저장 완료'; });
$('zoneClear').addEventListener('click',async()=>{ draftZone=[];dangerZone=[];
  await fetch('/zone/danger',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:[]})});
  $('zoneHint').textContent='지움'; });

$('startBtn').addEventListener('click',async()=>{ $('startBtn').style.display='none';
  await loadZone();
  const s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}});
  video.srcObject=s; await video.play(); render();
});
</script>
</body>
</html>
