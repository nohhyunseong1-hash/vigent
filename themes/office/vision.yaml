# ─────────────────────────────────────────────────────────────
# VIGENT Office 테마 선언 — 사무직 자세교정 '복지' 도구
#
# 목적: 감시가 아니라 근로자 복지. 익명 집계 + 얼굴 블러 기본 on.
# 같은 코어를 쓰고, safety 와 다른 점은 이 설정 + 프론트(index.html) 뿐.
# (개인정보보호법·근로기준법: 동의·고지·노사협의 대상 → 기본 익명 집계)
# ─────────────────────────────────────────────────────────────
theme: office
brand: VIGENT
display_name: "VIGENT Office"

privacy:                          # ── 개인정보 보호(office 핵심)
  face_blur: true                 # 얼굴 블러 기본 ON
  anonymous_aggregate: true       # 개인 식별 없이 집계만
  notice: "본 도구는 자세 교정 복지 목적의 익명 분석입니다. 영상은 저장·전송되지 않습니다."

perception:                       # ── Guard (감지) — office 는 사람·자세만
  detectors:
    - {id: person, model: vigent-core/weights/yolo11m.pt, fallback: vigent-core/weights/yolo11s.pt, classes: [person]}
  pose:    {model: mediapipe_pose, fallback: mediapipe_holistic}
  tracker: none                   # 익명 — 개인 추적 안 함

judgment:                         # ── Analyst (판단), 가산식
  ergonomics:                     # ── 핵심: 인간공학(사무직 자세) — RULA 상체
    framework: RULA
    joints:
      neck:     {good: 15, warn: 25}    # 목 전방/숙임(거북목)
      trunk:    {good: 10, warn: 20}    # 허리 굽힘(구부정)
      shoulder: {good: 8,  warn: 15}    # 어깨 좌우 비대칭
    hold_sec: 60                  # 나쁜 자세 60초 지속 시 부드러운 알림(복지 톤)
    coaching: true                # 실시간 자세 코칭 표시
    reminder_min: 50              # N분마다 스트레칭 리마인더(근골격계 예방: 50분 작업·10분 휴식 권장)
    law_rule: ergonomic_risk
  rules:
    - {id: bad_posture, when: "ergonomics.level == bad for hold_sec", severity: low}
  score: additive

vlm:                              # ── 영상→자세 분석(로컬 MLX) — office 톤(복지·코칭)
  model: mlx-community/Qwen2.5-VL-3B-Instruct-4bit
  fallback: none
  cooldown_sec: 30
  language: ko
  output_schema: [자세평가, 위험부위, 교정조언, 관련지침]
  prompt: |
    당신은 사무직 근로자의 자세를 봐주는 친절한 인간공학(에르고노믹스) 코치다. 답변은 무조건 한국어로만 한다.
    이 사람의 앉은 자세를 보고 거북목·구부정한 허리·어깨 비대칭 등 근골격계 부담을 평가하라.
    감시가 아니라 '복지·교정' 관점에서 따뜻하고 실용적으로 조언하라.
    아래 JSON 하나만 출력하라(설명·코드블록 금지):
    {"자세평가": "한국어", "위험부위": "목/허리/어깨 중 해당", "교정조언": "구체적·친절한 한국어", "관련지침": "KOSHA VDT/근골격계 예방 지침(모르면 빈 문자열)"}
    보이는 것에만 근거해 간결히 작성하라.

report:                           # ── Scribe (보고서) — 익명 집계 리포트
  templates: [posture_welfare_kr]
  output: [web]
  anonymous: true                 # 개인이 아니라 집단 통계만

evidence:                         # ── Copilot (근거) — 근골격계·VDT 지침
  corpus: [산업안전보건기준에관한규칙, KOSHA_Guide_VDT]
  retrieval: keyword
  cite: true

dispatch:                         # ── Dispatcher — 복지 톤(경보 아님)
  channels: [log, webhook]
  on_severity:
    low:    [gentle_reminder]     # "잠깐 스트레칭 어때요?" 수준의 부드러운 알림
    medium: [log]
