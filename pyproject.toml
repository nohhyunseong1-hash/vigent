# VIGENT — ruff 린터/포매터 최소 구성 (P1-5)
# 정본 파이썬: 3.13 (.python-version). 로직 변경 없이 포맷·import 정렬만 자동수정.
[tool.ruff]
line-length = 120
target-version = "py313"
# 사본/아카이브/산출물은 린트 대상에서 제외(.gitignore 와 정합)
extend-exclude = [
    "VIGENT_archive", "VIGENT USB", "vigent-landing 2", "vigentFacialRecognition",
    "VIGENT_artifacts", "benchmarks/results", "runs", "data", "weights",
    "cloud", "**/vendor/**",
]

[tool.ruff.lint]
# 최소 규칙: pyflakes(F) · import 정렬(I) · pycodestyle 경고(E/W) · blind-except(BLE).
#   ★ BLE001 유지 = 기존 '# noqa: BLE001'(의도된 폴백 패턴) 규율과 정합.
select = ["E", "F", "I", "W", "BLE"]
# ignore: 아래는 '의도된 스타일/패턴'이라 손대지 않고 규칙만 끈다(출력 0 유지 → 새 경고가 묻히지 않게).
#   E501  라인 길이(format 관리) · E402 지연 import(sys.path 후) · E701/E702 밀집 다중문(의도) ·
#   E731  lambda 대입 · E741  모호한 변수명 · BLE001 blind-except(가산식 폴백 패턴, '# noqa' 규율은 유지되나 대량이라 룰 오프)
ignore = ["E501", "E402", "E701", "E702", "E731", "E741", "BLE001"]

[tool.ruff.format]
# 문서·주석의 한국어 그대로, 따옴표는 기존 관례 최대 보존
quote-style = "preserve"

# ── mypy 점진 도입 (P2-12) ──
# 원칙: strict 전면 금지. 아래 files 화이트리스트 모듈만 검사하고, 정리된 모듈부터 하나씩 편입한다.
#   대상 순서: app_state → web_util → routers/ → worker → main.
[tool.mypy]
python_version = "3.13"
mypy_path = "vigent-core"            # 모듈이 bare import(import app_state 등) → sys.path 처럼 해석
ignore_missing_imports = true        # cv2·rfdetr·supervision 등 스텁 없는 서드파티는 무시
disable_error_code = ["import-untyped"]   # PyYAML 등 스텁 미제공 라이브러리(우리 코드만 타입, 서드파티 스텁은 도입 안 함)
follow_imports = "silent"            # 비대상 import 모듈은 따라가되 그쪽 에러는 보고 안 함(점진)
check_untyped_defs = true            # 미힌트 함수도 '본문'은 타입검사(라우터 핸들러 대상)
files = [
    "vigent-core/app_state.py",
    "vigent-core/web_util.py",
    "vigent-core/runtime_config.py",
    "vigent-core/zone_tile.py",
    "vigent-core/routers/vitals.py",
    "vigent-core/routers/dispatch.py",
    "vigent-core/routers/system.py",
    "vigent-core/routers/tapo.py",
    "vigent-core/routers/incident.py",
    "vigent-core/routers/detect.py",
    "vigent-core/routers/office.py",
    "vigent-core/routers/zone.py",
    "vigent-core/routers/sports.py",
    "vigent-core/routers/tbm.py",
    "vigent-core/routers/ppe.py",
    "vigent-core/routers/recognition.py",
    "vigent-core/routers/safety_core.py",
    "vigent-core/worker.py",
    "vigent-core/main.py",
]

# 완전 타입 강제 — 비핸들러 모듈만(미힌트 함수를 에러로). 힌트 보강이 실질이 되도록.
[[tool.mypy.overrides]]
module = [
    "app_state",
    "web_util",
    "runtime_config",
    "zone_tile",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 라우터·worker·main 은 '관대' 검사(P2-12): 반환힌트 강제 안 함.
#   - 라우터: FastAPI(≥0.89)가 핸들러 반환타입을 response_model 로 채택 → -> dict/str 추가 시
#     OpenAPI 응답스키마가 바뀜(동작 불변 위반).
#   - worker: 여러 함수가 cv2.VideoCapture·numpy·복합 tuple 을 반환 → 정확 타입에 Any 불가피(규칙4 → 제외).
#   - main: 라우트 핸들러 root() 가 라우터와 동일 이슈.
#   대신 전역 check_untyped_defs 로 '본문'만 타입검사(새 타입에러 유입 방지). 반환힌트는 강제하지 않는다.
[[tool.mypy.overrides]]
module = [
    "routers.*",
    "worker",
    "main",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
