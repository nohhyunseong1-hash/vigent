# VIGENT — ruff 린터/포매터 최소 구성 (P1-5)
# 정본 파이썬: 3.13 (.python-version). 로직 변경 없이 포맷·import 정렬만 자동수정.
[tool.ruff]
line-length = 120
target-version = "py313"
# 사본/아카이브/산출물은 린트 대상에서 제외(.gitignore 와 정합)
extend-exclude = [
    "VIGENT_archive", "VIGENT USB", "vigent-landing 2", "vigentFacialRecognition",
    "VIGENT_artifacts", "benchmarks/results", "runs", "data", "weights",
    "cloud", "**/vendor/**",
]

[tool.ruff.lint]
# 최소 규칙: pyflakes(F) · import 정렬(I) · pycodestyle 경고(E/W) · blind-except(BLE).
#   ★ BLE001 유지 = 기존 '# noqa: BLE001'(의도된 폴백 패턴) 규율과 정합.
select = ["E", "F", "I", "W", "BLE"]
# ignore: 아래는 '의도된 스타일/패턴'이라 손대지 않고 규칙만 끈다(출력 0 유지 → 새 경고가 묻히지 않게).
#   E501  라인 길이(format 관리) · E402 지연 import(sys.path 후) · E701/E702 밀집 다중문(의도) ·
#   E731  lambda 대입 · E741  모호한 변수명 · BLE001 blind-except(가산식 폴백 패턴, '# noqa' 규율은 유지되나 대량이라 룰 오프)
ignore = ["E501", "E402", "E701", "E702", "E731", "E741", "BLE001"]

[tool.ruff.format]
# 문서·주석의 한국어 그대로, 따옴표는 기존 관례 최대 보존
quote-style = "preserve"
