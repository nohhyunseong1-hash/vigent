<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1a1a1a">파일럿 현장 구성 — 카메라 2대</text>
  <text x="30" y="60" font-size="12.5" fill="#6b7280">국내 중량물 제조 A사 (실명 비공개). <tspan font-weight="700">2대 구성은 실측 근거</tspan>: 광역 CCTV만으로는 하물 높이·자세 판정 불가.</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>

  <!-- 작업 현장 박스 -->
  <rect x="30" y="86" width="560" height="330" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="46" y="108" font-size="13" font-weight="700" fill="#374151">작업 현장 (인양 구역)</text>

  <!-- 크레인 -->
  <line x1="120" y1="130" x2="470" y2="130" stroke="#4b5563" stroke-width="7"/>
  <line x1="120" y1="130" x2="120" y2="360" stroke="#9ca3af" stroke-width="5"/>
  <line x1="470" y1="130" x2="470" y2="360" stroke="#9ca3af" stroke-width="5"/>
  <text x="295" y="122" font-size="11.5" text-anchor="middle" fill="#4b5563" font-weight="600">천장 크레인</text>
  <!-- 후크·하물 -->
  <line x1="300" y1="134" x2="300" y2="212" stroke="#6b7280" stroke-width="2"/>
  <path d="M292 212 L300 226 L308 212 Z" fill="#6b7280"/>
  <line x1="262" y1="252" x2="300" y2="226" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="338" y1="252" x2="300" y2="226" stroke="#6b7280" stroke-width="1.6"/>
  <rect x="252" y="252" width="96" height="30" rx="3" fill="#9ca3af" stroke="#4b5563"/>
  <text x="300" y="272" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">하물</text>
  <text x="300" y="300" font-size="10.5" text-anchor="middle" fill="#6b7280">(줄걸이 결속)</text>

  <!-- 작업자 -->
  <g fill="#f59e0b">
    <circle cx="222" cy="322" r="8"/><rect x="216" y="332" width="12" height="26" rx="3"/>
    <circle cx="380" cy="322" r="8"/><rect x="374" y="332" width="12" height="26" rx="3"/>
  </g>
  <text x="222" y="378" font-size="10.5" text-anchor="middle" fill="#92400e" font-weight="600">작업자</text>
  <text x="380" y="378" font-size="10.5" text-anchor="middle" fill="#92400e" font-weight="600">작업자</text>
  <!-- 지면 -->
  <line x1="60" y1="360" x2="560" y2="360" stroke="#9ca3af" stroke-width="2"/>

  <!-- 카메라1 광역 -->
  <rect x="60" y="150" width="118" height="58" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="119" y="170" font-size="11.5" text-anchor="middle" font-weight="700" fill="#1d4ed8">① 광역 CCTV</text>
  <text x="119" y="186" font-size="10" text-anchor="middle" fill="#374151">위험구역 진입</text>
  <text x="119" y="199" font-size="10" text-anchor="middle" fill="#374151">보호구 · 화재</text>
  <path d="M178 190 L245 300" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 카메라2 근접 -->
  <rect x="480" y="150" width="100" height="58" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="530" y="170" font-size="11.5" text-anchor="middle" font-weight="700" fill="#c2410c">② 근접 카메라</text>
  <text x="530" y="186" font-size="10" text-anchor="middle" fill="#374151">하물 · 자세</text>
  <text x="530" y="199" font-size="10" text-anchor="middle" fill="#c2410c" font-weight="700">RIG 경보용</text>
  <path d="M480 196 L360 268" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- 실측 근거 -->
  <rect x="60" y="382" width="500" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="70" y="399" font-size="10.5" fill="#991b1b"><tspan font-weight="700">실측 근거:</tspan> 광역 CCTV에서 작업자 박스 26~64px(화면 0.1~0.4%) → 하물 높이·자세 판정 불가 → 근접 카메라 필수</text>

  <!-- 엣지박스 -->
  <path d="M590 250 H645" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="650" y="200" width="260" height="106" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="668" y="224" font-size="13" font-weight="700" fill="#15803d">엣지박스 (현장 내 처리)</text>
  <text x="668" y="245" font-size="11" fill="#374151">L1 감지 · RIG 경보 판정 · L2 문서</text>
  <rect x="668" y="256" width="224" height="38" rx="5" fill="#fff" stroke="#86efac"/>
  <text x="780" y="272" font-size="10.5" text-anchor="middle" font-weight="700" fill="#15803d">영상 원본 현장 외 반출 없음</text>
  <text x="780" y="287" font-size="10" text-anchor="middle" fill="#6b7280">외부 API 전송 기본 차단 (코드로 강제)</text>

  <!-- 출력 2단계 -->
  <path d="M780 306 V336" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="650" y="340" width="126" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="713" y="362" font-size="11.5" text-anchor="middle" font-weight="700" fill="#b45309">상태 인지</text>
  <text x="713" y="379" font-size="10" text-anchor="middle" fill="#6b7280">황색 · 저강도</text>
  <text x="713" y="395" font-size="10" text-anchor="middle" fill="#6b7280">작업 진행 표시</text>
  <text x="713" y="410" font-size="9.5" text-anchor="middle" fill="#92400e">(경보 아님)</text>

  <rect x="784" y="340" width="126" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="847" y="362" font-size="11.5" text-anchor="middle" font-weight="700" fill="#b91c1c">경보</text>
  <text x="847" y="379" font-size="10" text-anchor="middle" fill="#6b7280">적색 · 연속</text>
  <text x="847" y="395" font-size="10" text-anchor="middle" fill="#6b7280">경광등 · 부저</text>
  <text x="847" y="410" font-size="9.5" text-anchor="middle" fill="#991b1b">운전실 + 관리자</text>

  <!-- 경보 경로 -->
  <path d="M784 378 H600 V330 H470" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrR)"/>
  <text x="600" y="324" font-size="10" fill="#b91c1c" font-weight="600">운전실 경보</text>

  <!-- 하단 주의 -->
  <rect x="30" y="440" width="880" height="96" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="46" y="461" font-size="12" font-weight="700" fill="#111">구성 원칙</text>
  <text x="46" y="481" font-size="11" fill="#4b5563">· <tspan font-weight="700">2단계 출력</tspan>으로 경보 피로 방지 — 정상 절차상의 근접은 "상태 인지"일 뿐 경보하지 않는다.</text>
  <text x="46" y="500" font-size="11" fill="#4b5563">· <tspan font-weight="700">현장 내 처리</tspan> — 영상 원본은 현장을 벗어나지 않는다(개인정보보호·B2G 조달 요건).</text>
  <text x="46" y="519" font-size="11" fill="#b91c1c">· <tspan font-weight="700">보조·감시 계층</tspan> — 인증 안전장치(안전 PLC·방호장치)를 대체하지 않는다. 최종 판단·조치는 안전관리자 책임.</text>
</svg>
