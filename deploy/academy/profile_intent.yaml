# 학원 프로파일이 전역 기본값과 **의도적으로** 다른 항목 — 선언 목록
#
# ★왜 이 파일이 있는가(2026-08-24):
#   학원 프로파일은 `copy` 로 **파일 전체를 덮는** 방식이라, 기본값에 키가 추가되면
#   프로파일이 조용히 뒤처진다. 실제로 6개 키(proximity 2 · retention 3 · zone 1)가
#   누락돼 [F5](전역 구역 폴백 차단)·[F6](자동 파기)가 학원에서 무효화될 뻔했다.
#   → `scripts/check_profile_drift.py` 와 `tests/test_profile_drift.py` 가 이 파일을
#     기준으로 **누락 키**와 **선언되지 않은 값 변경**을 게이트에서 잡는다.
#
# 규칙:
#   · 기본값에 있는 키가 프로파일에 없으면 → 무조건 실패(드리프트).
#   · 값이 다르면 → 아래 `overrides` 에 선언돼 있어야 통과. 선언 없으면 실패.
#   · 프로파일에만 있는 키는 → 아래 `profile_only` 에 선언돼 있어야 통과.
#   · 기본값 키를 **의도적으로 뺀** 경우는 → 아래 `omitted` 에 키(또는 접두)와 이유를 선언해야 통과(2026-09-10 추가).
#   · 새 차이를 만들 때는 **이유를 함께** 적는다. 이유 없는 차이는 나중에 아무도 못 되돌린다.

tuning:
  base: config/tuning.yaml
  profile: deploy/academy/tuning.academy.yaml
  profile_only:
    detect.include_forklift:
      value: 1
      why: "학원 실습 대상이 지게차다 — 전역은 F-7(과소학습 오탐)로 기본 제외이나 여기선 켠다."
    detect.include_fire_smoke:
      value: 0
      why: "화재 감시가 계약 범위 밖이고, 프레스 현장 실측에서 배경 오탐 리스크가 확인됐다."
    ppe.required:
      value: [NO-Hardhat, NO-Safety-Vest]
      why: >-
        마스크 제외. 현장 시험 2026-08-27 관측: 보호구 경보 490건 중 87건이
        마스크 미착용만이 방아쇠였고, 보호구를 갖춰 입은 04·07 장면은 122건 중 81건이었다
        (안전모 0.83~0.91·조끼 0.87~0.93 정상 착용인데 울림 — 육안 확인).
        야외 중장비 실습장에서 마스크는 필수 보호구가 아니다.
        ★전역 기본값은 3종 그대로 둔다 — 실내 분진 작업 등 다른 현장에서는 필수일 수 있다.
        근거: benchmarks/ppe_mask_share_ci.py · audit/field_v1.2_reanalysis_2026-08-28.md
  overrides:
    notify.heartbeat_at:
      value: "08:30"
      why: >-
        [F-35, 2026-09-22] 하루 1회 "알림 채널 정상" 통보 시각. 학원 **수업 시작 전**으로 잡아,
        이 메시지가 안 오면 그날 경보가 못 나갈 수 있다는 뜻이므로 수업 전에 손쓸 시간이 생긴다.
        전역 기본은 빈 값(끔) — 현장마다 일과 시각이 다르므로 프로파일에서만 켠다.
        근거: 2026-08-21~09-10 에 텔레그램 401 로 20일간 경보 213건이 못 갔는데 **아무 신호도
        없었다**(benchmarks/FINDINGS.md F-35). 침묵이 신호가 되게 하는 장치다.
    detect.conf.forklift:
      value: 0.5
      why: >-
        forklift_boda_ax(yolo) 운용점. 전역 0.002 는 RF-DETR forklift 용 임계라
        yolo 모델에 그대로 쓰면 오탐이 쏟아진다.
        근거: benchmarks/forklift_duel_2026-08-19.md

vision:
  base: themes/safety/vision.yaml
  profile: deploy/academy/vision.academy.yaml
  omitted:
    judgment.ergonomics.joints:
      why: >-
        [2026-09-10 대표 결정] 근골격(ergonomic_risk) 규칙 OFF — 학원 계약 범위 밖 + 현장 보고서 §387 기울기 판정 오류.
        worker.ErgonomicsTracker 는 joints 가 비어 있으면 _enabled=False(설정 없으면 조용히 비활성)이므로 이 블록을
        joints_off_academy 로 이름만 바꿔 값은 보존한다. 포즈 스레드·MotionTracker(무동작=쓰러짐 의심)는 그대로.
        전역 themes/safety/vision.yaml 은 불변. 되돌리려면 키 이름을 joints 로. 근거: benchmarks/FINDINGS.md F-34.
  profile_only:
    judgment.ergonomics.joints_off_academy.neck.good:     {value: 25, why: "위 omitted 참조 — 값 보존용 개명 키"}
    judgment.ergonomics.joints_off_academy.neck.warn:     {value: 40, why: "위 omitted 참조 — 값 보존용 개명 키"}
    judgment.ergonomics.joints_off_academy.trunk.good:    {value: 20, why: "위 omitted 참조 — 값 보존용 개명 키"}
    judgment.ergonomics.joints_off_academy.trunk.warn:    {value: 45, why: "위 omitted 참조 — 값 보존용 개명 키"}
    judgment.ergonomics.joints_off_academy.shoulder.good: {value: 15, why: "위 omitted 참조 — 값 보존용 개명 키"}
    judgment.ergonomics.joints_off_academy.shoulder.warn: {value: 35, why: "위 omitted 참조 — 값 보존용 개명 키"}
  overrides:
    perception.backend.forklift:
      value: yolo
      why: >-
        G1 대결에서 forklift_boda_ax(yolo)가 RF-DETR 판을 이겼다(운용 conf 0.50).
        ★이 값이 yolo 이므로 vision.academy 의 detectors 에 forklift 항목이
        **반드시 있어야 한다** — 없으면 guard `_get_model` 이 None 을 돌려주고
        지게차 검출이 통째로 죽는다(F31 참조).
        근거: benchmarks/forklift_duel_2026-08-19.md
