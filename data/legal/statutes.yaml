## VIGENT 법령 화이트리스트 — active 조문만 인용 허용(A-SPRINT Phase 3)
## 게이트 원칙(§7 환각 차단):
##  - 이 목록에 없는 (법명+조번호) 인용은 차단/감사 대상.
##  - text 정본(text_status에 "정본" 포함)이 있는 조문만 "인용 내용까지" 대조.
##    text 없는 조문은 "번호만 통과" + 로그에 "원문 대조 필요" 플래그.
## 주의: 이 파일의 조문 '번호·용도'는 검수자(노현성)가 확정. 그러나 이 대화에서
##       사용자가 원문을 직접 붙여넣은 조문은 0건이므로, text 정본은 아직 없다.
##       (93조 text는 웹취득본 참고용 — 정본 아님)
