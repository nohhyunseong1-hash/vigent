<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGENT · Smart LOTO</title>
<style>
  :root{--bg:#0B0F14;--panel:rgba(10,16,22,.72);--line:#1c2730;--txt:#E6EDF3;
    --dim:#9CA8B4;--brand:#19E3B1;--warn:#F59E0B;--danger:#EF4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Pretendard",system-ui,sans-serif}
  .mono{font-family:ui-monospace,Menlo,monospace}
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;
    border-bottom:1px solid var(--line);background:#0d141b}
  header b{color:var(--brand)}
  .tag{margin-left:auto;font-size:12px;color:var(--warn);
    border:1px solid rgba(245,158,11,.4);border-radius:20px;padding:3px 10px}
  .wrap{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px;
    max-width:1050px;margin:0 auto}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 10px;font-size:12px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
  .lamp{display:flex;align-items:center;gap:16px}
  .bulb{width:70px;height:70px;border-radius:50%;border:3px solid var(--line);flex:none}
  .state{font-size:32px;font-weight:800}
  .sub{font-size:13px;color:var(--dim);margin-top:4px}
  .locks{margin-top:14px;font-size:13px}
  .locks .l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  input{width:100%;background:#0a1117;border:1px solid var(--line);border-radius:8px;
    color:var(--txt);padding:8px;font-size:13px}
  button{cursor:pointer;border:0;border-radius:8px;padding:11px;font-size:13px;font-weight:600;width:100%;margin-top:8px}
  .btn{background:var(--brand);color:#06241c}
  .btn.warn{background:var(--warn);color:#3a2800}
  .btn.danger{background:var(--danger);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:8px}
  .chk input{width:auto}
  video{width:100%;border-radius:8px;margin-top:8px;transform:scaleX(-1);display:none}
  .msg{font-size:12px;color:var(--dim);margin-top:8px;min-height:32px}
  .hw{font-size:11px;color:var(--dim);margin-top:10px}
</style>
</head>
<body>
<header><div><b>VIGENT</b> · Smart LOTO</div>
  <div class="tag">서보=보조 인터록 · 법정 물리 패드락 병행</div></header>

<div class="wrap">
  <div class="card">
    <h3>기계 상태 — PRESS-01</h3>
    <div class="lamp">
      <div class="bulb" id="bulb"></div>
      <div><div class="state" id="state">—</div>
        <div class="sub" id="sub"></div></div>
    </div>
    <div class="locks" id="locks"></div>
    <div class="hw mono" id="hw"></div>
  </div>

  <div class="card">
    <h3>작업자 · 잠금 제어</h3>
    <label>작업자 ID</label><input id="pid" placeholder="hong" />
    <label>이름</label><input id="pname" placeholder="홍길동" />
    <div class="chk"><input type="checkbox" id="useFace" /><label for="useFace" style="margin:0">얼굴로 인증(웹캠)</label></div>
    <video id="video" autoplay playsinline muted></video>
    <button class="btn warn" id="applyBtn">🔒 잠금 적용(LOTO)</button>
    <button class="btn ghost" id="removeBtn">🔓 내 잠금 해제</button>
    <button class="btn" id="energizeBtn">▶ 기동(energize)</button>
    <button class="btn danger" id="shutdownBtn">■ 정지(안전)</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$('video'), cap=document.createElement('canvas');
let camOn=false;

function render(s){
  const locked = s.hardware?.locked;
  $('state').textContent = {LOCKED_OUT:'잠금(LOCKED OUT)',SAFE_IDLE:'대기(안전)',ENERGIZED:'가동중'}[s.state]||s.state;
  $('bulb').style.background = locked ? 'var(--danger)' : 'var(--brand)';
  $('bulb').style.boxShadow = `0 0 24px ${locked?'var(--danger)':'var(--brand)'}`;
  $('sub').textContent = s.can_energize ? '잠금 없음 — 기동 가능' : `잠금 ${s.lock_count}개 — 기동 불가`;
  $('locks').innerHTML = (s.locks||[]).map(l=>
    `<div class="l"><span>🔒 ${l.name||l.person_id} <small style="color:var(--dim)">(${l.person_id})</small></span><span class="mono" style="color:var(--dim)">${(l.applied_at||'').slice(11,16)}</span></div>`).join('')
    || '<div style="color:var(--dim)">적용된 잠금 없음</div>';
  const h=s.hardware||{};
  $('hw').textContent = `서보: ${h.locked?'LOCKED':'UNLOCKED'} · ${h.simulated?'시뮬레이션':'실물('+h.port+')'}`;
}
async function refresh(){ render(await (await fetch('/loto/status')).json()); }

async function startCam(){
  if(camOn) return;
  try{ const s=await navigator.mediaDevices.getUserMedia({video:{width:480,height:360}});
    video.srcObject=s; await video.play(); video.style.display='block'; camOn=true;
  }catch(e){ $('msg').textContent='카메라 오류: '+e.message; }
}
function grab(){ cap.width=video.videoWidth; cap.height=video.videoHeight;
  cap.getContext('2d').drawImage(video,0,0); return new Promise(r=>cap.toBlob(r,'image/jpeg',0.85)); }

async function post(url){
  const fd=new FormData();
  if($('useFace').checked && camOn){ fd.append('image',await grab(),'f.jpg'); fd.append('live','true'); }
  if($('pid').value) fd.append('person_id',$('pid').value.trim());
  if($('pname').value) fd.append('name',$('pname').value.trim());
  const j=await (await fetch(url,{method:'POST',body:fd})).json();
  $('msg').textContent = j.ok ? '✅ 완료' : '⚠ '+(j.error||'실패');
  if(j.machine_id) render(j); else refresh();
}
$('useFace').onchange=()=>{ if($('useFace').checked) startCam(); };
$('applyBtn').onclick=()=>post('/loto/apply');
$('removeBtn').onclick=()=>post('/loto/remove');
$('energizeBtn').onclick=async()=>{ const fd=new FormData(); fd.append('by',$('pid').value||'operator');
  const j=await (await fetch('/loto/energize',{method:'POST',body:fd})).json();
  $('msg').textContent=j.ok?'✅ 기동':'⚠ '+(j.error||'실패'); if(j.machine_id)render(j);else refresh(); };
$('shutdownBtn').onclick=async()=>{ const fd=new FormData(); fd.append('by',$('pid').value||'operator');
  const j=await (await fetch('/loto/shutdown',{method:'POST',body:fd})).json(); if(j.machine_id)render(j);else refresh(); };
refresh();
</script>
</body>
</html>
