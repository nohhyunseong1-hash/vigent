<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VIGENT · 비전 데모</title>
<style>
  :root{--bg:#0B0F14;--line:#1c2730;--txt:#E6EDF3;--dim:#9CA8B4;--brand:#19E3B1}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Pretendard",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:12px 18px;
    border-bottom:1px solid var(--line);background:#0d141b}
  .logo{font-weight:800;letter-spacing:1px}.logo b{color:var(--brand)}
  nav{display:flex;gap:6px}
  .tab{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);
    padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600}
  .tab.on{background:var(--brand);color:#06241c;border-color:var(--brand)}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:#EF4444;
    box-shadow:0 0 8px #EF4444;animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .frameWrap{height:calc(100vh - 58px)}
  iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:12px;color:var(--dim);background:#0d141b;border:1px solid var(--line);
    border-radius:20px;padding:6px 14px}
</style>
</head>
<body>
<header>
  <div class="logo"><b>VIGENT</b> · 비전 데모</div>
  <nav>
    <button class="tab on" data-src="/demo/facial">얼굴 인식</button>
    <button class="tab" data-src="/demo/wellbeing">동요·피로 지표</button>
    <button class="tab" data-src="/demo/evm">모션 확대</button>
    <button class="tab" data-src="/demo/mfa">출입 인증</button>
  </nav>
  <div class="live"><span class="dot"></span>LIVE DEMO · :8010</div>
</header>

<div class="frameWrap"><iframe id="frame" src="/demo/facial" allow="camera"></iframe></div>
<div class="hint">탭을 바꾸면 카메라가 해당 데모로 전환됩니다 · 각 화면에서 “웹캠 시작”을 누르세요</div>

<script>
const frame=document.getElementById('frame');
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    frame.src='about:blank';            // 이전 데모의 카메라·루프 정지
    setTimeout(()=>{ frame.src=t.dataset.src; }, 60);  // 활성 탭만 로드(카메라 1개)
  };
});
</script>
</body>
</html>
