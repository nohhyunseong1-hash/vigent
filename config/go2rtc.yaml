# go2rtc — Tapo RTSP 를 브라우저용(WebRTC/MSE)으로 변환.
# ★이 파일은 '템플릿'(비번 없음, git 추적). 실행 시 data/go2rtc.runtime.yaml(gitignore)로 복사되어
#   동적 스트림(카메라별 RTSP·자격증명)은 그 런타임 사본에만 기록된다 → 템플릿엔 비번이 남지 않음.
streams:
  tapo: ${RTSP_URL}     # 실제 주소는 .env 의 RTSP_URL 에서 환경변수로 주입(파일에 비번 없음)
# [S2, 2026-08-10] api·webrtc 둘 다 127.0.0.1로 고정 — 이전엔 ":PORT"(전 인터페이스 바인딩) +
#   go2rtc 자체 무인증이라 VIGENT_API_TOKEN 인증을 완전히 우회하는 별도 공격면이었다
#   (내부망의 아무 기기나 1984로 스트림 등록/삭제, 8555로 라이브 영상 접근 가능했음).
#   원격 관제 PC에서 확대뷰가 필요한 배포는 docs/edge_network_hardening.md
#   §원격 확대뷰가 필요한 배포 절차를 따를 것(이 템플릿을 그대로 열지 않는다 — 방화벽 화이트리스트로).
api:
  listen: "127.0.0.1:1984"
webrtc:
  listen: "127.0.0.1:8555"
  # 같은 머신(로컬 브라우저)에서는 127.0.0.1 후보로 ICE 성립. GO2RTC_LAN_IP 후보는 listen이
  # 127.0.0.1로 잠겨 있는 한 도달 불가(무해 — ICE가 자동으로 스킵하고 127.0.0.1로 폴백).
  # 원격 확대뷰 배포 시에는 위 문서 절차대로 listen도 함께 바꿔야 이 후보가 실제로 동작한다.
  candidates:
    - 127.0.0.1:8555
    - ${GO2RTC_LAN_IP}:8555
