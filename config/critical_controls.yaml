# 생명직결(즉시사망) 필수확정 통제 레지스트리
#
# 목적: 비전으로 감지 못 해도 '수동확인 blank'로 남기지 않고, 위험수준+법령을 부여해
#       위험을 '확정'(누락 방지 §7)한다. T1 baseline의 핵심 약점(under-commitment 43%,
#       생명직결 통제 미확정으로 C1 자동 불합격 5건)을 해소하기 위함.
#
# ★ 과적합 금지(중요): 이 레지스트리는 실패한 홀드아웃 케이스를 역설계해 만든 것이 아니라,
#   아래 '도메인 표준'에서 도출했다. 그래서 홀드아웃에 없는 통제(개구부 방호 등)도 포함한다.
#   위험수준은 표준 severity 기준의 '기본값'이며, 현장 상황에 따라 안전관리자가 조정 가능(§6 가산·폴백).
#
# 도메인 표준 출처:
#   - 고용노동부·KOSHA 「사고사망 주요 유형」: 추락·끼임·부딪힘·물체에맞음·무너짐·질식·감전·화재폭발
#   - 중대재해처벌법(중대산업재해: 사망 1명 이상 등)
#   - 「산업안전보건기준에 관한 규칙」(안전보건규칙) — 조문 근거
#   - config/corpus/jsa_hazards.json (한전 스마트TBM JSA 대상작업 8종)
#
# 적용(승인 후 Scribe.build_checklist 반영 예정):
#   - check_point 가 아래 match(부분일치) 에 해당하고 비전 미감지면 → 위험수준+법령 확정(적정성=X, "확인필요" 병기).
#   - 레지스트리 밖 항목은 기존 동작('수동확인') 보존 → 불필요한 강제 확정(over-commitment) 방지.
#   - 이미 비전 감지로 확정된 항목은 건드리지 않음(기존 위험수준·법령 불변 → 회귀 방지).

_meta:
  version: "1.0-draft"
  status: "강사 승인 대기(적용 전)"
  rule_book: "산업안전보건기준에 관한 규칙"

controls:
  # ── 질식(밀폐공간) — KOSHA 밀폐공간 질식재해예방, 규칙 제619~625조 ──
  - id: confined_gas_measure
    category: 질식(밀폐공간)
    match: ["산소농도", "유해가스 농도", "산소결핍", "가스 농도 측정"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제619조의2"]
    출처: "KOSHA 밀폐공간 질식재해예방 · 규칙 제619조의2(산소·유해가스 농도 측정)"
    근거: 산소18~23.5%·유해가스 미측정 상태 진입은 질식 즉시사망

  - id: confined_ventilation
    category: 질식(밀폐공간)
    match: ["지속 환기", "작업 중 지속", "지속환기"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제620조"]
    출처: "규칙 제620조(환기 등) · KOSHA 밀폐공간 프로그램"
    근거: 작업 중 환기 중단은 산소결핍·유해가스 축적으로 사망

  - id: confined_watcher
    category: 질식(밀폐공간)
    match: ["외부 비상연락", "감시인 배치 및 외부", "밀폐공간 감시인"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제623조"]
    출처: "규칙 제623조(감시인의 배치 등)"
    근거: 외부 감시인·비상연락 부재 시 이상 발생해도 구조 불가

  - id: confined_rescue_gear
    category: 질식(밀폐공간)
    match: ["구조장비", "구명줄"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제624조", "산업안전보건기준에 관한 규칙 제625조"]
    출처: "규칙 제624조(안전대 등)·제625조(대피 등)"
    근거: 구명줄·구조장비 미비 시 요구조자 회수 불가(2차 재해 유발)

  # ── 감전(전기) — 규칙 제319~323조, KOSHA 정전전로 작업 ──
  - id: electrical_deenergize
    category: 감전
    match: ["정전·검전", "검전 및 단락접지", "단락접지"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제319조"]
    출처: "규칙 제319조(정전전로에서의 전기작업)"
    근거: 정전·검전·단락접지 미시행 시 잔류전하·오투입 감전 사망

  - id: electrical_loto
    category: 감전
    match: ["무단투입", "잠금·표지", "LOTO"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제319조"]
    출처: "규칙 제319조제2항(잠금·표지) · KOSHA 정전작업 LOTO"
    근거: 잠금·표지 없이 정전작업 중 제3자 무단투입 시 감전 사망

  # ── 무너짐(굴착) — 규칙 제338~347조 ──
  - id: excavation_shoring
    category: 무너짐(굴착)
    match: ["흙막이 지보공", "굴착면 기울기"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제338조", "산업안전보건기준에 관한 규칙 제345조"]
    출처: "규칙 제338·339·345~347조(붕괴 방지·기울기·흙막이 지보공)"
    근거: 지보공·기울기 미준수 시 굴착면 붕괴·토사 매몰 사망

  - id: excavation_buried
    category: 무너짐(굴착)
    match: ["지하매설물"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제341조"]
    출처: "규칙 제341조(매설물 등에 의한 위험 방지)"
    근거: 가스·전력 매설물 미조사 굴착 시 폭발·감전 사망

  # ── 무너짐(거푸집·동바리) — 규칙 제331·332조 (홀드아웃 비포함: 표준 기반 포함) ──
  - id: shoring_formwork
    category: 무너짐(거푸집동바리)
    match: ["동바리 조립도", "동바리 좌굴"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제331조", "산업안전보건기준에 관한 규칙 제332조"]
    출처: "규칙 제331조의2·제332조(거푸집·동바리 조립·준수사항)"
    근거: 동바리 좌굴·조립도 미준수 시 콘크리트 타설 중 붕괴 사망

  # ── 물체에맞음(양중) — 규칙 제146·163·167조 ──
  - id: lifting_rigging
    category: 물체에맞음(중량물 양중)
    match: ["줄걸이 결속", "인양 각도", "인양구"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제163조", "산업안전보건기준에 관한 규칙 제167조"]
    출처: "규칙 제163조(달기구 안전계수)·제167조(폐기)"
    근거: 줄걸이 파단·결속 불량 시 중량물 낙하 사망

  # ── 떨어짐(고소작업대) — 규칙 제186조 ──
  - id: mewp_outrigger
    category: 떨어짐(고소작업대)
    match: ["아웃트리거"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제186조"]
    출처: "규칙 제186조(고소작업대 사용)"
    근거: 아웃트리거 미전개·과상승 시 작업대 전도·추락 사망

  # ── 떨어짐(개구부·단부) — 규칙 제42·43조 (홀드아웃 비포함: 표준 기반 포함) ──
  - id: fall_opening
    category: 떨어짐(개구부·단부)
    match: ["개구부", "단부 덮개", "개구부 덮개"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제42조", "산업안전보건기준에 관한 규칙 제43조"]
    출처: "규칙 제42조(추락의 방지)·제43조(개구부 등의 방호 조치)"
    근거: 개구부·단부 미방호 시 추락 사망

  # ── 화재·폭발(화기작업) — 규칙 제241조의2 ──
  - id: hotwork_fire_watch
    category: 화재폭발(화기작업)
    match: ["화기감시인", "화재감시자"]
    기본_위험수준: 상
    법령: ["산업안전보건기준에 관한 규칙 제241조의2"]
    출처: "규칙 제241조의2(화재감시자)"
    근거: 화재감시자 부재 시 불티 잔화 화재·폭발 사망(작업 후 30분 감시 포함)
