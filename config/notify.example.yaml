# config/notify.example.yaml — 알림 설정 예시. 이 파일을 config/notify.yaml 로 복사해 값을 채운다.
# ★[CODE_AUDIT_20260928 #7] 예전 예시는 telegram.bot_token / sites / AX_TELEGRAM_BOT_TOKEN 이었는데, 코드(agents/dispatcher.py notify_cfg)는
#   아래 **평면 키**만 읽는다. 예전 예시대로 쓰면 자가시험이 not_configured 가 되고 경보가 어디에도 안 간다.
# 우선순위: notify.yaml 의 값 → 비어 있으면 환경변수(괄호 안 이름). 값은 절대 git 에 올리지 않는다(.gitignore 의 config/notify.yaml).
# 자가시험: 기동 시 텔레그램 getMe 로 토큰을 확인하고 /health notify.selftest_state 에 ok | config_error | unknown | not_configured 로 보인다.

telegram_token: ""        # @BotFather 봇 토큰 (env TELEGRAM_BOT_TOKEN). 형식 123456789:AA...
telegram_chat: ""         # 받을 chat_id. 개인은 양수, 그룹/채널은 -100 으로 시작 (env TELEGRAM_CHAT_ID)
webhook_url: ""           # 선택 — POST JSON 을 받을 URL (env WEBHOOK_URL)
smtp_host: ""             # 선택 — 이메일 채널. 예 smtp.gmail.com (env SMTP_HOST)
smtp_port: 587            # (env SMTP_PORT)
smtp_user: ""             # 보내는 계정 (env SMTP_USER)
smtp_pass: ""             # Gmail 은 앱 비밀번호 16자 (env SMTP_PASS). docs/ops/email_notify_setup.md
email_to: ""              # 받는 주소, 쉼표로 여러 명 (env EMAIL_TO)
