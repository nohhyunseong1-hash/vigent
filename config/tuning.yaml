# VIGENT 현장 튜닝값 — 현장·카메라마다 이 파일만 고치면 됨(코드 수정 불필요)
# 값을 바꾸면 서버 재시작 시 적용. 환경변수가 있으면 환경변수가 우선(예: VIGENT_RADIUS_M).

proximity:                  # 협착(작업반경) 감지
  radius_m: 3.0             # 위험반경(m) — 사람이 이 거리 안에 들어오면 경보
  vehicle_ref_m:            # 장비 실제 가로폭(m) — 거리 추정 기준자(장비 모델 맞춰 조정)
    forklift: 2.5
    truck: 6.0
    car: 4.5
    bus: 11.0
    crane: 8.0
    excavator: 6.0

fall:                       # 낙상 감지
  angle_deg: 55             # 몸통 각도 임계(클수록 둔감) — 카메라 각도 맞춰 조정
  drop: 0.12                # 급강하 임계(화면 높이 비율)

motion:                     # 무동작·급이동
  immobile_s: 45            # 이 시간(초) 이상 안 움직이면 쓰러짐 의심
  rapid_dist: 0.15          # 짧은 시간 이만큼 이동하면 급이동(돌진)

crowd:
  threshold: 6              # 인원 이 수 이상 몰리면 군집 위험

detect:                     # 탐지 공통
  cooldown_s: 15            # 같은 위험 재기록 최소 간격(초)
  imgsz: 960                # 추론 해상도(클수록 작은 객체↑·느림)
  stale_max_misses: 1       # 잔상 제거: 미매칭 트랙이 이 프레임 수 넘으면 폐기(작을수록 잔상↓·깜빡임↑)
  conf:                     # 검출기별 신뢰도 임계(낮을수록 많이 잡음=오탐↑)
    person: 0.40            # 0.35→0.40: 약한 사람 오탐↓(진짜 사람은 0.8+)
    ppe: 0.62               # 0.55→0.62: 보호구 미착용 오탐↓ (아래 ppe_per_class 없는 클래스의 폴백)
    ppe_per_class:          # 클래스별 후필터(최약체 NO-Hardhat 재현율↑). 비우면 위 단일 ppe 값 사용.
      NO-Hardhat: 0.30      # 재현율 50.7→~64%(P≥90 유지) — 미착용 감지 최약체 보강
      NO-Mask: 0.50         # 재현율 63.5→~70%
      NO-Safety-Vest: 0.50  # 재현율 66.0→~68%
    forklift: 0.002         # T10b RF-DETR 이관: 이 모델은 confidence 스케일이 낮음(0.001~0.005).
      # D-Fire 스윕 실측 0.002 → recall 34.9%/FAR 35%(YOLO 0.68의 R35.7/FAR28.7과 유사 recall·FAR 다소↑).
      # ⚠️ 잠정 운용점(과소학습 conf 낮음, F-7). backend=yolo 로 되돌리면 반드시 0.68 로 복원.
    fire_smoke: 0.55        # 단일 폴백(아래 fire_smoke_per_class 없는 라벨용). 실제 임계는 클래스별 맵.
    fire_smoke_per_class:   # T14-F(F-6 완화): fire·smoke conf 분포가 달라 단일 임계로 둘 다 만족 불가.
      fire: 0.03            # D-Fire 실측 recall 10.5→~54%(FAR 8.6%). 화재는 놓침이 최악 → 낮게.
      smoke: 0.20           # recall 7.6→~25%(FAR 9.2%). 더 낮추면 구름·연무 오검출 급증(0.03시 FAR 27.7%).
      # ⚠️ D-Fire 기준 잠정 완화. 임계 천장(사용가능 FAR 내 최대 recall≈54%) → 근본 해결은 T10b 재학습.

vlm:                        # VLM(보호구 점검 등) 속도·정확도
  ppe_max_tokens: 128       # 답변 토큰(작을수록 빠름·길면 정확)
  ppe_max_side: 768         # 입력 이미지 최대 변(작을수록 빠름·크면 정확)
