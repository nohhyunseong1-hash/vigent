# VIGENT 현장 튜닝값 — 현장·카메라마다 이 파일만 고치면 됨(코드 수정 불필요)
# 값을 바꾸면 서버 재시작 시 적용. 환경변수가 있으면 환경변수가 우선(예: VIGENT_RADIUS_M).

proximity:                  # 협착(작업반경) 감지
  radius_m: 3.0             # 위험반경(m) — 사람이 이 거리 안에 들어오면 경보
  vehicle_ref_m:            # 장비 실제 가로폭(m) — 거리 추정 기준자(장비 모델 맞춰 조정)
    forklift: 2.5
    truck: 6.0
    car: 4.5
    bus: 11.0
    crane: 8.0
    excavator: 6.0

fall:                       # 낙상 감지
  angle_deg: 55             # 몸통 각도 임계(클수록 둔감) — 카메라 각도 맞춰 조정
  drop: 0.12                # 급강하 임계(화면 높이 비율)

motion:                     # 무동작·급이동
  immobile_s: 45            # 이 시간(초) 이상 안 움직이면 쓰러짐 의심
  rapid_dist: 0.15          # 짧은 시간 이만큼 이동하면 급이동(돌진)

crowd:
  threshold: 6              # 인원 이 수 이상 몰리면 군집 위험

detect:                     # 탐지 공통
  cooldown_s: 15            # 같은 위험 재기록 최소 간격(초)
  imgsz: 960                # 추론 해상도(클수록 작은 객체↑·느림)
  stale_max_misses: 1       # 잔상 제거: 미매칭 트랙이 이 프레임 수 넘으면 폐기(작을수록 잔상↓·깜빡임↑)
  conf:                     # 검출기별 신뢰도 임계(낮을수록 많이 잡음=오탐↑)
    person: 0.40            # 0.35→0.40: 약한 사람 오탐↓(진짜 사람은 0.8+)
    ppe: 0.35               # T10b RF-DETR 이관: conf 스케일 재튜닝(구 YOLO 0.62). raw 스윕 전 클래스 recall 80~100%.
      # 구 YOLO per-class 하향 override(NO-Hardhat 0.30 등)는 구 모델의 미착용류 약세 보완용이었음.
      # RF-DETR은 단일 base 0.35에서 미착용류 recall 80~97로 상회해 제거(f73ffa0 이후).
      # 향후 특정 클래스 약세가 현장에서 확인되면 per_class 인프라(guard ppe_per_class)로 재도입 가능.
      # 근거(0.30 vs 0.35 실측): NO-Hardhat R88=88 동일·NO-SafetyVest R97.2=97.2 동일(FAR만↑)·NO-Mask 80→86.7이나 FAR 3.8→7.7. 이득 미미/역효과.
    # ppe_per_class 제거(RF-DETR 단일 0.35로 충분). backend=yolo 롤백 시 ppe 0.62 + override(NO-Hardhat 0.30/NO-Mask 0.50/NO-Safety-Vest 0.50) 복원.
    forklift: 0.002         # ★ 잠정 비활성(2026-07-11): detect_frame 기본 detectors에서 제외(main.py).
      # F-7 과소학습으로 정탐/오탐 conf가 완전 겹침 — 정탐 p50 0.002·max 0.005 = 오탐과 동일(웹캠 벤치 실측).
      # 어떤 임계도 오탐만 못 거름(0.002=정탐34.9%+오탐폭탄 / 0.01↑=정탐0). 사람 몸통을 conf 0.002로 오인(pos_bare 100%).
      # → 임계 0.30 은폐형 off 기각, 명시적 detectors 제외로 처리. 이 임계값(0.002)은 측정/게이트 경로
      #   (payload.detectors 명시 지정) 전용. T10b full 재학습 + 현장 데이터 운용점 스윕 후 복원.
      # (구 이력) D-Fire 스윕 0.002 → recall 34.9%/FAR 35%. backend=yolo 롤백 시 0.68 복원.
    fire_smoke: 0.55        # 단일 폴백(아래 fire_smoke_per_class 없는 라벨용). 실제 임계는 클래스별 맵.
    fire_smoke_per_class:   # T10b RF-DETR 이관(e17): fire·smoke conf 분포가 달라 클래스별 분리. RF-DETR 스케일로 재튜닝.
      fire: 0.30            # D-Fire raw 스윕 R95.9%/FAR1.1%(구 YOLO R53.6 대비 대폭↑). 화재 놓침 최악 → recall 우선.
      smoke: 0.50           # raw 스윕 R87.9%/FAR15.4%(구 R24.85 대비 3.5배). 조기경보 가치로 recall 우선.
      # ⚠️ 조건부: pipeline 재측정 smoke FAR>18%면 0.60(R77.9/FAR9.2)로 후퇴. in-domain(D-Fire) 기준 — 현장 재검증 대기.
      # 되돌리려면 backend.fire_smoke 를 yolo 로, 임계를 fire 0.03/smoke 0.20 으로 원복.

vlm:                        # VLM(보호구 점검 등) 속도·정확도
  ppe_max_tokens: 128       # 답변 토큰(작을수록 빠름·길면 정확)
  ppe_max_side: 768         # 입력 이미지 최대 변(작을수록 빠름·크면 정확)
