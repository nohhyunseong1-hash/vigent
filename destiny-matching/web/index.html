<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>운명 매칭 | Phase 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#0c1017",
            surface: "#121a26",
            panel: "#192232",
            primary: "#e2bb65",
            text: "#ebeff6",
            muted: "#aab1bf",
          },
          fontFamily: {
            serif: ["Libre Caslon Text", "serif"],
            sans: ["Manrope", "sans-serif"],
          },
        },
      },
    };
  </script>
  <style>
    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at top, rgba(226,187,101,.14), transparent 24%),
        linear-gradient(180deg, #090c12, #0c1017 38%, #0c1017);
    }

    .tag-chip.active {
      background: rgba(226, 187, 101, 0.16);
      border-color: rgba(226, 187, 101, 0.9);
      color: #ebeff6;
    }
  </style>
</head>
<body class="bg-background font-sans text-text">
  <main class="mx-auto max-w-6xl px-6 py-12">
    <section class="mb-10 rounded-[28px] border border-[rgba(226,187,101,.16)] bg-[rgba(18,26,38,.72)] p-8 backdrop-blur-xl">
      <p class="text-sm tracking-[0.3em] text-primary">PHASE 1</p>
      <h1 class="mt-4 font-serif text-5xl leading-tight">사주 계산은 엄격하게. 해석은 설명 가능하게.</h1>
      <p class="mt-5 max-w-3xl text-lg leading-8 text-muted">
        이 화면은 단일 사용자 리딩 검증용이다. 얼굴 이미지는 품질 확인만 하고, 해석은 사주와 사용자가 직접 고른 인상 태그를 기반으로만 구성한다.
      </p>
    </section>

    <section class="grid gap-8 lg:grid-cols-[1fr_0.9fr]">
      <div class="rounded-[28px] border border-[rgba(226,187,101,.12)] bg-[rgba(25,34,50,.76)] p-8">
        <h2 class="font-serif text-3xl">입력</h2>
        <div class="mt-6 grid gap-5">
          <input id="name" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 text-lg focus:border-primary focus:outline-none" placeholder="이름">
          <div class="grid gap-5 md:grid-cols-2">
            <select id="gender" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none">
              <option>남성</option>
              <option>여성</option>
              <option>기타</option>
            </select>
            <input id="birthDate" type="date" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none">
          </div>
          <div class="grid gap-5 md:grid-cols-2">
            <select id="calendarType" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none">
              <option>양력</option>
              <option>음력</option>
            </select>
            <input id="birthTime" type="time" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none">
          </div>
          <div class="rounded-3xl border border-[rgba(226,187,101,.12)] bg-[rgba(255,255,255,.02)] p-5">
            <p class="text-sm tracking-[0.22em] text-primary">프로필 사진</p>
            <div class="mt-4 grid gap-5 md:grid-cols-[0.82fr_1.18fr]">
              <label class="flex min-h-56 cursor-pointer items-center justify-center rounded-3xl border border-dashed border-[rgba(226,187,101,.2)] bg-[rgba(255,255,255,.02)] p-4 text-center" for="photoInput">
                <div>
                  <p class="text-lg">사진 업로드</p>
                  <p class="mt-2 text-sm leading-6 text-muted">성격 추론용이 아니라 품질 확인과 프로필 카드 미리보기용입니다.</p>
                </div>
              </label>
              <div class="grid gap-4">
                <input id="photoInput" type="file" accept="image/*" class="hidden">
                <img id="photoPreview" alt="" class="hidden h-56 w-full rounded-3xl object-cover">
                <div id="qualityPanel" class="rounded-2xl border border-[rgba(226,187,101,.12)] bg-[rgba(255,255,255,.02)] p-4 text-sm leading-7 text-muted">
                  사진을 올리면 해상도와 기본 품질 안내가 표시됩니다.
                </div>
              </div>
            </div>
          </div>
          <div class="rounded-3xl border border-[rgba(226,187,101,.12)] bg-[rgba(255,255,255,.02)] p-5">
            <p class="text-sm tracking-[0.22em] text-primary">첫인상 태그</p>
            <div id="tagGroup" class="mt-4 flex flex-wrap gap-3">
              <button type="button" data-tag="차분함" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">차분함</button>
              <button type="button" data-tag="단정함" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">단정함</button>
              <button type="button" data-tag="밝음" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">밝음</button>
              <button type="button" data-tag="활발함" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">활발함</button>
              <button type="button" data-tag="부드러움" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">부드러움</button>
              <button type="button" data-tag="도시적" class="tag-chip rounded-full border border-[rgba(226,187,101,.18)] px-4 py-2 text-sm text-muted transition hover:border-primary">도시적</button>
            </div>
            <p class="mt-3 text-sm leading-6 text-muted">태그는 얼굴 자동 판정이 아니라 사용자가 직접 고르는 사회적 인상 정보입니다.</p>
          </div>
          <textarea id="manse" rows="4" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none" placeholder="만세력 메모"></textarea>
          <textarea id="appearance" rows="4" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none" placeholder="외형 메모 또는 사용자가 고른 첫인상 태그"></textarea>
          <textarea id="intro" rows="4" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 focus:border-primary focus:outline-none" placeholder="자기소개"></textarea>
          <input id="interests" class="rounded-2xl border border-[rgba(226,187,101,.16)] bg-transparent px-4 py-4 text-lg focus:border-primary focus:outline-none" placeholder="관심사 예: 전시, 영화, 러닝">
          <button id="generateBtn" class="rounded-full bg-primary px-6 py-4 font-semibold text-[#1a150b]">데모 결과 생성</button>
        </div>
      </div>

      <div class="rounded-[28px] border border-[rgba(226,187,101,.12)] bg-[rgba(18,26,38,.78)] p-8">
        <h2 class="font-serif text-3xl">결과 프리뷰</h2>
        <div class="mt-6 rounded-3xl border border-[rgba(226,187,101,.12)] bg-[rgba(255,255,255,.02)] p-6">
          <p class="text-sm tracking-[0.28em] text-primary">DISCLAIMER</p>
          <p class="mt-3 text-sm leading-7 text-muted">전통 명리 기반 엔터테인먼트 해석이며 과학적·의학적 판단이 아닙니다.</p>
        </div>
        <div id="result" class="mt-5 whitespace-pre-wrap rounded-3xl border border-[rgba(226,187,101,.12)] bg-[rgba(255,255,255,.02)] p-6 text-[15px] leading-8 text-text">아직 생성 전입니다.</div>
      </div>
    </section>
  </main>

  <script>
    const result = document.getElementById("result");
    const qualityPanel = document.getElementById("qualityPanel");
    const photoPreview = document.getElementById("photoPreview");
    const selectedTags = new Set();

    document.querySelectorAll(".tag-chip").forEach((button) => {
      button.addEventListener("click", () => {
        const tag = button.dataset.tag;
        if (selectedTags.has(tag)) {
          selectedTags.delete(tag);
          button.classList.remove("active");
        } else if (selectedTags.size < 5) {
          selectedTags.add(tag);
          button.classList.add("active");
        }
      });
    });

    document.getElementById("photoInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        const messages = [];
        const resolutionOk = image.width >= 720 && image.height >= 720;
        const sizeOk = file.size <= 8 * 1024 * 1024;

        messages.push(resolutionOk ? "해상도: 통과" : "해상도: 720px 이상 권장");
        messages.push(sizeOk ? "용량: 통과" : "용량: 8MB 이하 권장");
        messages.push("정면도, 조명, 단일 얼굴 여부는 실제 비전 모듈 연동 시 확정됩니다.");

        photoPreview.src = url;
        photoPreview.classList.remove("hidden");
        qualityPanel.textContent = messages.join(" / ");
      };
      image.src = url;
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value || "미입력 사용자";
      const appearance = document.getElementById("appearance").value || "외형 메모 없음";
      const intro = document.getElementById("intro").value || "자기소개 없음";
      const interests = document.getElementById("interests").value || "관심사 없음";
      const tags = selectedTags.size ? Array.from(selectedTags).join(", ") : "선택 없음";
      result.textContent = [
        `${name} 리딩`,
        "",
        "사주 계산 상태",
        "- 현재 UI는 Phase 1 데모다.",
        "- 실제 명식 계산은 백엔드 어댑터 연동 후 검증된 만세력 엔진으로 수행한다.",
        "",
        "프로필 보조 정보",
        `- 첫인상 태그: ${tags}`,
        `- 외형 메모: ${appearance}`,
        `- 자기소개: ${intro}`,
        `- 관심사: ${interests}`,
        `- 이미지 품질 안내: ${qualityPanel.textContent}`,
        "",
        "해석 원칙",
        "- 얼굴 이미지는 성격이나 운명을 자동 추론하는 데 사용하지 않는다.",
        "- 사용자가 직접 입력한 정보와 사주 계산 결과만 해석에 사용한다.",
        "- 첫인상 태그와 관심사는 소개 톤과 대화 훅 생성에만 반영한다.",
      ].join("\n");
    });
  </script>
</body>
</html>
