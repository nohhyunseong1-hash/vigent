# PPE v2 — 현장 데이터 본 실험(2026-09-27 준비, 실행은 데이터 도착·CVAT 검수 후). 공개 데이터 경로는 전부 종결(docs/data/public_ppe_candidates_20260927.md).
# 시작점: COCO rf-detr-nano(헤드 새로) · 데이터: CSS v27 + 현장 초벌→검수 라벨 · 검증 = **현장 valid 만**(valid_only_from) · held-out 300 은 학습 금지(heldout.json 자동 가드)
# 가드: 슬롯 가드(COCO 시작은 검사 생략) · NaN 감시 · 정체 감시 · seed 고정 · notes 기록 · 10 epoch 마다 현장 held-out 중간 평가(heldout_eval_every)
# 경로의 ${VIGENT_FIELD_DIR} 는 env(기본 D:/vigent_private_data/field/prelabel). dry-run 은 VIGENT_FIELD_DIR 로 합성 자료를 가리켜 확인한다.
classes: [person, Hardhat, NO-Hardhat, Safety-Vest, NO-Safety-Vest]
harness: ppe
init: coco
sources:
  - name: css_v27
    kind: yolo_yaml
    path: data/datasets/css_safety/data.yaml
    splits: {train: train, valid: valid}
  - name: field
    kind: vigent
    labels: ${VIGENT_FIELD_DIR}/labels
    images: ${VIGENT_FIELD_DIR}/images
    split: ${VIGENT_FIELD_DIR}/split.json
valid_only_from: [field]                                  # 학습 중 검증은 현장 valid(카메라 단위 분할)만 — CSS valid 는 검증에 넣지 않는다
exclude_files: benchmarks/results/v1_heldout_eval.json    # CSS held-out 91(하네스 '전/후' 표용)
exclude_manifests:
  - ${VIGENT_FIELD_DIR}/heldout.json                       # 현장 held-out 300 + 그 클립의 음성 — 학습 금지(heldout_guard)
train:                                                     # CLI 기본값(명시한 CLI 인자가 우선)
  epochs: 50
  lr: 1.0e-4
  batch: 8
  grad_accum: 2
  res: 384
  seed: 20260927
  eval_interval: 2
  val_subsample: 0                                         # 현장 valid 는 전체(수백 장) 그대로
  heldout_eval_every: 10
  field_heldout: ${VIGENT_FIELD_DIR}
