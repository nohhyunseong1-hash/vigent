# PPE 스모크 B — A 대비 변수 하나: 507 train 이미지의 "라벨 누락" 조끼 클래스를 v1 준라벨(conf≥0.6, 미검수)로 메운다. [2026-09-27 결정 ③, 가설 채택]
# 근거 [실측 scan_507_unlabeled]: 507 train 2,200장 중 v1 이 조끼(착용/미착용) 박스를 내는 이미지 89.8%(NO-Safety-Vest 81.0%·Safety-Vest 8.8%) 인데 507 라벨엔 조끼 클래스 0개
#   → A 에서는 이 조끼들이 전부 "배경"으로 학습돼 NO-Safety-Vest 를 억제했다는 가설(dev74 NO-SV 74→60/112). Hardhat 착용 머리는 0.0%(1장)라 메우지 않는다.
# 학습 중 검증셋: CSS valid 전량(114) + 507 val ≤200(시드 추림) — 507 치우침 제거. 나머지 조건(클래스·시작점·하이퍼·준라벨 681장 미검수)은 A 와 동일.
classes: [person, Hardhat, NO-Hardhat, Safety-Vest, NO-Safety-Vest]
harness: ppe
init: vigent-core/weights/ppe_rfdetr_v1.pth
valid_limit_per_source: {aihub_507: 200}
sources:
  - name: css_v27
    kind: yolo_yaml
    path: data/datasets/css_safety/data.yaml
    splits: {train: train, valid: valid}
  - name: aihub_507
    kind: vigent
    labels: ${VIGENT_DATA_DIR}/aihub/vigent_507/labels        # A 와 같은 라벨 + ★train 프레임에만 pseudo:v1:Safety-Vest+NO-Safety-Vest 병합(사이드카 source 표기)
    images: ${VIGENT_DATA_DIR}/aihub/_inspect/507_src
    split: ${VIGENT_DATA_DIR}/aihub/vigent_507/split.json
  - name: pseudo_507_sample
    kind: vigent
    labels: ${VIGENT_DATA_DIR}/aihub/pseudo_507/labels        # A 와 동일(681장, 미검수 conf≥0.6 Hardhat)
    images: ${VIGENT_DATA_DIR}/aihub/docs_507
    split: ${VIGENT_DATA_DIR}/aihub/pseudo_507/split.json
exclude_files: benchmarks/results/v1_heldout_eval.json
